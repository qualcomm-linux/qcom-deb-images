actions:
- deploy:
    rootfs_image: disk-sdcard.img2
    overlay_path: /
    qcomflash:
      headers:
        Authorization: Q_S3_TOKEN
      url: "{{BUILD_DOWNLOAD_URL}}/{{SUITE}}-flash-emmc.tar.gz"
      apply-overlay: true
    timeout:
      minutes: 20
    to: qdl
- boot:
    firehose_program: xbl_s_devprg_ns.melf
    rawprogram: rawprogram0.xml
    patch: patch0.xml
    path: flash_glymur-crd_nvme/spinor
    storage: spinor
    debug: true
    timeout:
      minutes: 15
    method: qdl
- boot:
    firehose_program: xbl_s_devprg_ns.melf
    rawprogram: rawprogram0.xml
    patch: patch0.xml
    path: flash_glymur-crd_nvme
    storage: nvme
    debug: true
    timeout:
      minutes: 15
    method: qdl
- command:
    name: network_turn_on
- boot:
    auto_login:
      login_prompt: 'login:'
      username: debian
      password_prompt: 'Password'
      password: debian
      login_commands:
      - "debian"
      - "new password"
      - "new password"
      - sudo su
    method: minimal
    parameters:
      # glymur-crd's serial console drops bytes during the fast boot output
      # burst, so the single-line default kernel-start-message
      # ('Linux version [0-9]') is frequently mangled and never matched,
      # stalling auto-login until timeout. Match the kernel timestamp prefix
      # instead: it recurs on every dmesg line, so no single dropped line can
      # defeat it, and it arms the login logic as early as possible.
      kernel-start-message: '\[ *[0-9]+\.[0-9]+\]'
    prompts:
    - root@debian
    - debian@debian
    - "Current password"
    - "New password"
    - "Retype new password"
    timeout:
      minutes: 3
- test:
    timeout:
      minutes: 5
    definitions:
    - from: git
      name: "smoke-test"
      path: automated/linux/smoke/smoke.yaml
      repository: https://github.com/linaro/test-definitions.git
      parameters:
        SKIP_INSTALL: "True"
        TESTS: "pwd, uname -a, ip a"
    - from: git
      name: "wlan-smoke-test"
      path: automated/linux/wlan-smoke/wlan-smoke.yaml
      repository: https://github.com/linaro/test-definitions.git
      parameters:
        SKIP_INSTALL: "True"
        WAIT_TIME: 60
context:
  test_character_delay: 10
device_type: glymur-crd
job_name: smoke tests {{GITHUB_REPOSITORY}} {{GITHUB_RUN_ID}}-{{GITHUB_RUN_ATTEMPT}}
metadata:
  build-commit: '{{GITHUB_SHA}}'
priority: 50
timeouts:
  job:
    minutes: 210
visibility: public
