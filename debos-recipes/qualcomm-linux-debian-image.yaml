{{- $dtb := or .dtb "firmware" }}
{{- $imagesize := or .imagesize "6GiB" }}
{{- $imagetype := or .imagetype "ufs" }}
{{- $image := printf "disk-%s.img" $imagetype }}
{{- $profile := or .profile "default" }}
{{- $snapshot := or .snapshot "" }}

# kernel command line appended by the filesystem-deploy action below
# XXX these kernel options might be specific to a kernel version or board
{{- $kernelcmdline := "clk_ignore_unused pd_ignore_unused audit=0 deferred_probe_timeout=30" }}

# Snapdragon Windows-on-ARM laptops advertise a TPM2 in the EFI
# variables but expose no device for it ("TPM2 Support: firmware
# only, driver unavailable" in bootctl status), so the systemd units
# that wait for one timeout TODO check if this is detrimental on IoT
# systems
{{- $kernelcmdline = printf "%s systemd.tpm2_wait=0" $kernelcmdline }}

# Validate $profile; keep this list in sync with the list in the
# "Supported profiles" section of README.md
{{- $allowed_profiles := list "default" "performance" "debug" }}
{{- if not (has $profile $allowed_profiles) }}
{{- fail (printf "unknown profile %q" $profile) }}
{{- end }}


# The performance profile keeps the kernel serial console quiet to avoid the
# boot-time and CPU cost of synchronous output over a slow serial console.
#
# This mirrors meta-qcom's performance variant:
# https://github.com/qualcomm-linux/meta-qcom/blob/master/ci/performance.yml
# commit: a60563a7eba7b2444570c3e247954f242d348210
#
# Unlike meta-qcom, do not set initramfs.udev-root-only: Debian's
# initramfs-tools does not support it.
{{- if eq $profile "performance" }}
{{- $kernelcmdline = printf "%s quiet systemd.tty.term.console=dumb" $kernelcmdline }}
{{- end }}


# The debug profile enables ftrace from early boot so events leading up to an
# early hang or slow boot are captured before userspace starts. It also enables
# Qualcomm download mode so crashes and watchdog resets can leave a memory dump
# for debugging.
#
# This mirrors meta-qcom's debug variant:
# https://github.com/qualcomm-linux/meta-qcom/blob/master/ci/debug.yml
# commit: 178c74449bf68ca6ada5fb6774f492d498e04d7d
#
# and its base configuration:
# https://github.com/qualcomm-linux/meta-qcom/blob/master/ci/base.yml
# commit: 46a730e80ee0f50673e286051ff439d1031198fb
#
# Unlike meta-qcom, qcom_scm.download_mode=1 and the systemd hardware watchdog
# are enabled only for the debug profile.
#
# The profile is not complete yet: images currently consume a prebuilt kernel
# package and the debug image still installs the default kernel. The additional
# kernel debug options remain unavailable until the qcom-next-debug kernel
# package from is integrated.
{{- if eq $profile "debug" }}
# Keep trace events grouped by subsystem for readability, then combine them into
# the comma-separated trace_event= value used by meta-qcom's
# KERNEL_CMDLINE_EXTRA_FTRACE.
{{- $traceevents := "timer:timer_expire_entry,timer:timer_expire_exit" }}
{{- $traceevents = printf "%s,timer:hrtimer_cancel,timer:hrtimer_expire_entry,timer:hrtimer_expire_exit,timer:hrtimer_init,timer:hrtimer_start" $traceevents }}
{{- $traceevents = printf "%s,irq:*" $traceevents }}
{{- $traceevents = printf "%s,workqueue:*" $traceevents }}
{{- $traceevents = printf "%s,sched:sched_migrate_task,sched:sched_pi_setprio,sched:sched_switch,sched:sched_wakeup,sched:sched_wakeup_new" $traceevents }}
{{- $traceevents = printf "%s,power:clock_set_rate,power:clock_enable,power:clock_disable,power:cpu_frequency" $traceevents }}
{{- $traceevents = printf "%s,regulator:*" $traceevents }}
{{- $traceevents = printf "%s,thermal:thermal_zone_trip,thermal:thermal_temperature,thermal:cdev_update" $traceevents }}
{{- $traceevents = printf "%s,rpmh:rpmh_send_msg" $traceevents }}
{{- $kernelcmdline = printf "%s ftrace=tracing_on trace_buf_size=5M trace_event=%s" $kernelcmdline $traceevents }}

# download mode is what makes a crash inspectable at all: with it set, qcom_scm
# leaves SDI (and the TrustZone watchdog debug path) enabled, so a panic or a
# watchdog bite halts in the firmware with DDR preserved and the board comes
# back up in EDL for the host to pull a full dump, rather than warm resetting
# straight back into Linux with the evidence gone.
#
# this is deliberately not in the default and performance profiles: a board
# that crashes stays down until it is dumped or power cycled (a clean reboot or
# shutdown clears the mode, an unclean one does not), and while it sits in EDL
# anyone with a USB cable can read all of DDR out of it.
{{- $kernelcmdline = printf "%s qcom_scm.download_mode=1" $kernelcmdline }}
{{- end }}

architecture: arm64
sectorsize: {{if eq $imagetype "ufs"}}4096{{else}}512{{end}}

actions:
  - action: unpack
    description: Unpack root filesystem
    file: rootfs.tar

{{- if ne $profile "default" }}
  - action: run
    description: Record profile in /etc/buildinfo
    chroot: true
    command: |
      set -eux
      echo "PROFILE={{ $profile }}" >>/etc/buildinfo
{{- end }}

{{- if ne $dtb "firmware" }}
  - action: run
    description: Use OS device tree override (board specific)
    chroot: true
    command: |
      set -eux
      mkdir -pv /etc/kernel
      echo "{{ $dtb }}" >/etc/kernel/devicetree
{{- end }}

{{- if eq $profile "debug" }}
  - action: run
    description: Enable systemd hardware watchdog (debug profile)
    chroot: true
    command: |
      set -eux
      # Have systemd ping /dev/watchdog so a hang resets the board. With
      # qcom_scm.download_mode=1, the reset leaves a memory dump for debugging.
      #
      # Match meta-qcom's 30s timeout. This is close to the qcom-wdt hardware limit
      # and avoids false watchdog bites during slow, verbose debug boots. Use a
      # systemd drop-in rather than modifying Debian's packaged system.conf.
      #
      # Boards without a hardware watchdog are unaffected.
      mkdir -pv /etc/systemd/system.conf.d
      cat >/etc/systemd/system.conf.d/10-qcom-debug-watchdog.conf <<'EOF'
      [Manager]
      RuntimeWatchdogSec=30s
      EOF
{{- end }}

  # parttype values are from:
  # https://www.freedesktop.org/wiki/Specifications/DiscoverablePartitionsSpec/
  - action: image-partition
    description: Create an image file
    imagename: {{ $image }}
    imagesize: {{ $imagesize }}
    partitiontype: gpt
    partitions:
      - name: esp
        partlabel: ESP
        flags: [ boot, esp ]
        # EFI System Partition
        parttype: c12a7328-f81f-11d2-ba4b-00a0c93ec93b
        fs: vfat
        start: 4MiB
        # size of 512MiB
        end: 516MiB
        fsck: true
      - name: root
        # Root Partition (64-bit ARM/AArch64)
        parttype: b921b045-1df0-41c3-af44-4c6f280d3fae
        fs: ext4
        # 4MiB after ESP
        start: 520MiB
        end: 100%
        fsck: true
    mountpoints:
      - mountpoint: /boot/efi/
        partition: esp
        # Copy options from what systemd does when mounting a discoverable EFI partition:
        # https://github.com/qualcomm-linux/qcom-deb-images/pull/309
        #
        # Restrict fmask/dmask to prevent user access to /boot/efi/loader/random-seed
        # used by systemd-boot:
        # https://github.com/qualcomm-linux/qcom-deb-images/issues/279
        options:
          - nosuid
          - nodev
          - noexec
          - relatime
          - nosymfollow
          - fmask=0177
          - dmask=0077
          - codepage=437
          - iocharset=iso8859-1
          - shortname=mixed
          - errors=remount-ro
      - mountpoint: /
        partition: root

  - action: filesystem-deploy
    description: Deploy root filesystem to mounted image
    setup-fstab: true
    append-kernel-cmdline: "{{ $kernelcmdline }}"

{{- if $snapshot }}
  - action: run
    description: Enable snapshot sources for image build
    chroot: true
    command: |
      set -eux
      apt-snapshot-toggle enable
      apt-get update
{{- end }}

  - action: apt
    description: Make system bootable with systemd-boot
    recommends: true
    packages:
      - systemd-boot
      # TODO investigate why systemd-boot Recommends: shim-signed which
      # Depends on grub packages
      - shim-signed-

  # this is to provide an updated copy of DTBs from the OS to U-Boot, notably
  # on RB1
  - action: run
    description: Setup copying of DTBs to ESP partition
    chroot: true
    command: |
      set -eux
      # Fixes error when running outside qemu
      dpkg-divert --local --rename --add /etc/kernel/postinst.d/u-boot-efi-dtb
      ln -s /usr/bin/true /etc/kernel/postinst.d/u-boot-efi-dtb
      # u-boot-efi-dtb installs a kernel hook that will trigger on kernel
      # installation/upgrade, but also calls it explicitely in its postinst in
      # case it was installed after the kernel; it requires an ESP partition to
      # copy the DTBs though, so install it after the ESP partition is
      # available
      apt -y install u-boot-efi-dtb
      # Removing previous diversion and symlink
      rm /etc/kernel/postinst.d/u-boot-efi-dtb
      dpkg-divert --rename --remove /etc/kernel/postinst.d/u-boot-efi-dtb
      # when building under debos, /sys/firmware/efi is not always present, so
      # the u-boot-efi-dtb postinst doesn't install an initial copy of the
      # DTBs; do this once here
      # extract kernel list to variable to avoid silent pipeline failure
      kernel_list=$(linux-version list)
      latest_kernel=$(echo "$kernel_list" | linux-version sort --reverse | head -1)
      dtb_path="/usr/lib/linux-image-${latest_kernel}"
      cp -LRT "$dtb_path" "/boot/efi/dtb"

  - action: run
    description: Create task to grow root filesystem on first boot
    chroot: true
    command: |
      set -eux
      # for growpart
      apt -y install cloud-guest-utils
      # extract the dev of the root filesystem from fstab; change UUID=id into
      # /dev/disk/by-uuid/id
      ROOTFS_DEV=$(
          awk '$2 == "/" {gsub("UUID=", "/dev/disk/by-uuid/"); print $1}' \
              /etc/fstab
          )
      # generate systemd unit to grow the second partition with above UUID
      cat >/etc/systemd/system/debos-grow-rootfs.service <<EOF
      [Unit]
      Description=Grow root partition and filesystem (debos)
      [Service]
      Type=oneshot
      ExecStartPre=-sh -c 'growpart /dev/\`lsblk -n -o pkname $ROOTFS_DEV\` 2'
      ExecStart=resize2fs $ROOTFS_DEV
      ExecStartPost=/usr/bin/systemctl disable debos-grow-rootfs.service
      [Install]
      WantedBy=default.target
      EOF
      # enable unit
      systemctl enable debos-grow-rootfs

  - action: run
    description: Verify device trees were embedded in the kernel image
    chroot: true
    command: |
      set -eux
      # only meaningful when the dtb-loader overlay is part of this rootfs
      if [ ! -e /etc/kernel/install.d/95-dtb-loader.install ]; then
          echo "dtb-loader hook not installed, nothing to verify"
          exit 0
      fi
      # extract to a variable to avoid silent pipeline failure
      kernel_list=$(linux-version list)
      latest_kernel=$(echo "$kernel_list" | linux-version sort --reverse | head -1)
      # ask the boot loader entry which kernel image it actually boots rather
      # than guessing where kernel-install put it
      entry=$(echo /boot/efi/loader/entries/*"-${latest_kernel}.conf")
      kernel_image="/boot/efi$(awk '$1 == "linux" { print $2 }' "$entry")"
      sections=$(ukify inspect "$kernel_image")
      # the device trees and the hardware ID table used to choose between them
      echo "$sections" | grep -q '^\.hwids:'
      # grep -c exits non-zero on no match, so report the count ourselves
      dtbs=$(echo "$sections" | grep -c '^\.dtbauto:' || :)
      [ "$dtbs" -gt 0 ]
      echo "embedded ${dtbs} device trees in ${kernel_image}"
      # this must stay an ordinary kernel image rather than becoming a unified
      # kernel image, so that the initrd and the kernel command line keep coming
      # from the boot loader entry
      ! echo "$sections" | grep -q '^\.osrel:'
      ! echo "$sections" | grep -q '^\.initrd:'
      ! echo "$sections" | grep -q '^\.cmdline:'
      grep -q '^initrd ' "$entry"
      grep -q '^options ' "$entry"

{{- if $snapshot }}
  - action: run
    description: Restore APT sources to live mirrors and clean up snapshot helpers
    chroot: true
    command: |
      set -eux
      apt-snapshot-toggle disable
      rm -f /etc/apt/sources.list.d/snapshot_*.sources
      rm -f /usr/local/bin/apt-snapshot-toggle
{{- end }}

  - action: run
    description: Extract partition images
    postprocess: true
    command: |
      set -eux
      sector_size="{{if eq $imagetype "ufs"}}4096{{else}}512{{end}}"
      image="{{ $image }}"
      # extract fdisk output to variable to avoid silent pipeline failure
      fdisk_output=$(fdisk -b "${sector_size}" -l "${image}")
      echo "$fdisk_output" | sed -n '1,/^Device/ d; p' |
          while read name start end sectors rest; do
              dd if="${image}" of="${ARTIFACTDIR}/${name}" \
                  bs="${sector_size}" skip="${start}" count="${sectors}"
          done

