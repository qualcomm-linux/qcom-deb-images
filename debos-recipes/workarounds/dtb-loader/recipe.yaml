architecture: arm64

actions:
  - action: overlay
    description: Install DTB loader kernel hooks
    source: overlay

  # The kernel-install hook needs these at image build time, when the
  # systemd-boot postinst runs "kernel-install add", and on the running
  # system, so that a kernel upgrade re-wraps the new kernel instead of
  # quietly installing one with no device tree.
  - action: apt
    description: Install DTB loader generation
    recommends: true
    packages:
      # provides stubblify, the hardware ID database and the finddtbs script
      - stubble
      # provides the systemd-stub used as DTB loader
      - systemd-boot-efi
