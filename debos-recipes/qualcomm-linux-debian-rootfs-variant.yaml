{{- $architecture := .architecture }}
{{- $suite := .suite }}
{{- $variant := .variant }}

{{- if empty $architecture }}
{{- fail "architecture unset" }}
{{- end }}
{{- if empty $suite }}
{{- fail "suite unset" }}
{{- end }}
{{- if empty $variant }}
{{- fail "variant unset" }}
{{- end }}

# The supported variants, documented in the "Supported variants" section of
# README.md
{{- $allowed_variants := list "minimal" "console" "xfce" "gnome" "weston" "weston-multimedia" }}
{{- if not (has $variant $allowed_variants) }}
{{- fail (printf "unknown variant %q" $variant) }}
{{- end }}

architecture: {{ $architecture }}

actions:
{{- if eq $variant "minimal" }}
  # minimal has no packages of its own, but a recipe without actions errors
  # out, so say so instead
  - action: run
    description: Report that minimal has no extra packages
    chroot: false
    command: echo "No extra packages to install for the minimal variant"
{{- end }}

{{- if eq $variant "console" }}
  # console has no packages of its own, but a recipe without actions errors
  # out, so say so instead
  - action: run
    description: Report that console has no extra packages
    chroot: false
    command: echo "No extra packages to install for the console variant"
{{- end }}

{{- if eq $variant "xfce" }}
  # this should ideally be task-xfce-desktop, but this pulls too many apps;
  # instead, curate from the Depends and Recommends of task-xfce-desktop and
  # task-desktop recursively; also, disable Recommends
  - action: apt
    description: Install Xfce desktop
    recommends: false
    packages:
      # preempt these dependencies as to avoid pulling all backends
      - xserver-xorg-input-libinput
      - xserver-xorg-video-fbdev
      - xserver-xorg-input-all-
      - xserver-xorg-video-all-
      - xserver-xorg
      - plymouth-label- # we probably don't need a boot splash
      # nm-connection-editor below depends on polkit-1-auth-agent, and APT
      # picks up ukui-polkit as a random Provides; select mate-polkit instead
      - mate-polkit
      # from task-xfce-desktop
      - xfce4
      - lightdm
      - light-locker
      - xfce4-terminal
      - xfce4-power-manager
      - xfce4-power-manager-plugins
      - tango-icon-theme
      - network-manager-applet
      - nm-connection-editor
      - synaptic
{{- end }}

{{- if eq $variant "gnome" }}
# The following list of package is a manual selection from the gnome-core
# metapackage from trixie with some pruning. The list of packages is longer in
# forky, and needs to be revisited. Err out in the meantime.
# See: https://github.com/qualcomm-linux/qcom-deb-images/issues/416
{{- if ne $suite "trixie" }}
{{- fail (printf "gnome is only supported on trixie for now (see issue #416), got suite %q" $suite) }}
{{- end }}
  - action: apt
    description: Install GNOME desktop
    recommends: false
    packages:
      - plymouth-label- # we probably don't need a boot splash
      # from gnome-core (meta-gnome3 source package in trixie)
      # removing gnome-snapshot that would bring gstreamer1.0-plugins-bad
      # removing gnome-connections that would bring libfreerdp3 -> libavcodec61 -> libx265
      - gdm3
      - gnome-backgrounds
      - gnome-bluetooth-sendto
      - gnome-control-center
      - gnome-keyring
      - gnome-menus
      - gnome-session
      - gnome-settings-daemon
      - gnome-shell
      - gnome-user-docs
      - orca
      - gnome-sushi
      - tecla
      - adwaita-icon-theme
      - glib-networking
      - gsettings-desktop-schemas
      - baobab
      - evince
      - gnome-calculator
      - gnome-calendar
      - gnome-characters
      - gnome-clocks
      - gnome-terminal
      - gnome-contacts
      - gnome-disk-utility
      - gnome-font-viewer
      - gnome-logs
      - gnome-maps
      - gnome-software
      - gnome-system-monitor
      - gnome-text-editor
      - gnome-weather
      - nautilus
      - simple-scan
      - totem
      - yelp
      # Additional core dependencies from gnome-core
      - cups
      - evolution-data-server
      - fonts-cantarell
      - gstreamer1.0-packagekit
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gvfs-backends
      - gvfs-fuse
      - libatk-adaptor
      - libcanberra-pulse
      - libglib2.0-bin
      - libpam-gnome-keyring
      - pipewire-audio
      - system-config-printer-common
      - system-config-printer-udev
      - zenity
{{- end }}

{{- if has $variant (list "xfce" "gnome") }}
  - action: apt
    description: Install common desktop packages
    recommends: false
    packages:
      # from task-desktop
      - desktop-base
      - xdg-utils
      - fonts-symbola
      - avahi-daemon
      - libnss-mdns
      # bluetooth settings
      - blueman
      # audio: wireplumber for session integration, pipewire-pulse for chromium
      - pavucontrol
      - pipewire-pulse
      - wireplumber
      # camera: mostly supported through pipewire, but pull the qcam app
      # and cam CLI tool from libcamera-tools; also install libcamera
      # gstreamer plugins for gstreamer based apps; ideally, cam and
      # qcam would be packaged separately as to allow pulling the CLI
      # version outside of the desktop list. libcamera-v4l2 provides a
      # LD_PRELOAD library for compatiblity with apps relying on v4l2
      # (similar to pipewire and pulse situation)
      - gstreamer1.0-libcamera
      - libcamera-tools
      - libcamera-v4l2

{{- if or (ne $architecture "armhf") (eq $suite "trixie") }}
  # chromium is not built for armhf after trixie
  - action: apt
    description: Install web browser
    recommends: false
    packages:
      - chromium
{{- end }}
{{- end }}

{{- if has $variant (list "weston" "weston-multimedia") }}
# Install Weston, a lightweight Wayland compositor.
#
# The Weston package does not have any mechanism to start automatically at boot
# so greetd is used to create a user session and start Weston.
#
# The agreety text greeter provides a console login interface similar to getty,
# authenticates the user through PAM then launches Weston after login.
#
# greetd/agreety does not discover the installed compositors from
# /usr/share/wayland-sessions/*.desktop so Weston is set as the command to run
# after login.
#
# Weston logs to "$XDG_RUNTIME_DIR/weston.log", XDG_RUNTIME_DIR usually resolves
# to "/run/user/<UID>", so the log is only kept for the lifetime of the user's
# login session.
#
# greetd is configured through /etc/greetd/weston-session.toml rather than
# /etc/greetd/config.toml - the latter is a dpkg conffile shipped by the
# greetd package and may be overwritten on package upgrades.
  - action: apt
    description: Install Weston session packages
    recommends: false
    packages:
      - weston
      - greetd

  - action: overlay
    description: Configure Weston session
    source: overlays/weston-session
{{- end }}

{{- if eq $variant "weston-multimedia" }}
# Install the accelerated multimedia stack: out-of-tree kernel drivers and
# closed source user-space from the Qualcomm Linux APT repository.
  - action: apt
    description: Install DKMS
    packages:
      - gcc
      - dkms

  # CI does not use fakemachine. Limit DKMS build parallelism when
  # running under fakemachine, where the default 1GB memory can be exhausted
  # by multiple compiler jobs running in parallel.
  # $IN_FAKE_MACHINE is only set when not running in chroot.
  - action: run
    description: Configure DKMS for low-memory fakemachine builds
    chroot: false
    command: |
      set -eux
      if [ "${IN_FAKE_MACHINE:-}" = "yes" ]; then
        mkdir -p "${ROOTDIR}/etc/dkms/framework.conf.d"
        echo "parallel_jobs=1" > "${ROOTDIR}/etc/dkms/framework.conf.d/fakemachine.conf"
      fi

  - action: apt
    description: Install accelerated multimedia stack
    recommends: false
    packages:
      # Adreno GPU driver
      - kgsl-dkms
      - adreno-gles2
      - adreno-egl1
      - libgbm-msm1
      - adreno-opencl-icd
      - adreno-vulkan-icd

      # CamX
      - camx-dkms

      # CamX device-specific firmware
      - camx-firmware-glymur
      - camx-firmware-hamoa

      # CamX camera service
      - qti-camera-server

      # CamX device-specific runtime libraries
      # camx-glymur and camx-hamoa are only built for trixie; see
      # https://github.com/qualcomm-linux/pkg-camx-glymur/issues/8 and
      # https://github.com/qualcomm-linux/pkg-camx-hamoa/issues/20
{{- if eq $suite "trixie" }}
      - camx-server-runtime-all
{{- end }}

      # CamX test applications
      - camx-nhx
      - qcom-fastcv-utils

      # Iris Video Processing Unit
      - iris-vpu-dkms

  - action: run
    description: Remove temporary DKMS configuration
    chroot: true
    command: |
      set -eux
      rm -rf /etc/dkms/framework.conf.d/fakemachine.conf
{{- end }}

