{{- $xfcedesktop := or .xfcedesktop "false" }}
{{- $gnomedesktop := or .gnomedesktop "false" }}
{{- $westonsession := or .westonsession "false" }}
{{- $multimedia := or .multimedia "false" }}
{{- $localdebs := or .localdebs "none" }}
{{- $aptlocalrepo := or .aptlocalrepo "none" }}
# $kernelpackage (singular) is deprecated, superseded by $kernelpackages
{{- $kernelpackages := or .kernelpackages .kernelpackage "linux-image-qcom-next,linux-headers-qcom-next" }}
{{- $overlays := or .overlays "none" }}
{{- $qliaptrepo := or .qliaptrepo "true" }}
{{- $buildid := or .buildid "" }}
{{- $snapshot := or .snapshot "" }}
{{- $suite := or .suite "trixie" }}
{{- $extract_dbg_vmlinux := or .extract_dbg_vmlinux "false" }}

# xfcedesktop, gnomedesktop, westonsession and multimedia (booleans) are
# deprecated, superseded by the single $variant variable below
# see https://github.com/qualcomm-linux/qcom-deb-images/issues/691
{{- $legacyvariants := list }}
{{- if eq $xfcedesktop "true" }}
{{- $legacyvariants = append $legacyvariants "xfce" }}
{{- end }}
{{- if eq $gnomedesktop "true" }}
{{- $legacyvariants = append $legacyvariants "gnome" }}
{{- end }}
{{- if eq $westonsession "true" }}
{{- $legacyvariants = append $legacyvariants "weston" }}
{{- end }}
{{- if eq $multimedia "true" }}
{{- $legacyvariants = append $legacyvariants "multimedia" }}
{{- end }}
{{- if and .variant $legacyvariants }}
{{- fail "variant cannot be set together with the deprecated variables" }}
{{- end }}

# $variant is validated by qualcomm-linux-debian-rootfs-variant.yaml
{{- $variant := or .variant (join "-" $legacyvariants) "console" }}

# Rename sid to unstable to reduce if/else complexity
{{- if eq $suite "sid" }}
{{- $suite = "unstable" }}
{{- end }}

architecture: arm64

actions:
{{- if .kernelpackage }}
  - action: run
    description: Warn that the kernelpackage variable is deprecated
    chroot: false
    command: |
      echo "WARNING: the 'kernelpackage' debos variable is deprecated and superseded by 'kernelpackages' (a comma-separated list); please migrate as 'kernelpackage' will be removed in a future release" >&2
      # give the operator a chance to notice the warning before the build scrolls past
      echo "(sleeping 10s to get some attention and leave some time to read this)" >&2
      sleep 10
{{- end }}
{{- if $legacyvariants }}
  - action: run
    description: Warn that legacy variant variables are deprecated
    chroot: false
    command: |
      echo "WARNING: the 'xfcedesktop', 'gnomedesktop', 'westonsession' and 'multimedia' debos variables are deprecated and superseded by 'variant'; please migrate as they will be removed in a future release" >&2
      echo "see https://github.com/qualcomm-linux/qcom-deb-images/issues/691" >&2
      # give the operator a chance to notice the warning before the build scrolls past
      echo "(sleeping 10s to get some attention and leave some time to read this)" >&2
      sleep 10
{{- end }}

{{- if $snapshot }}
  - action: run
    description: Validate snapshot timestamp
    chroot: false
    command: |
      set -eu
      if ! echo "{{ $snapshot }}" | grep -qE '^[0-9]{8}T[0-9]{6}Z$'; then
        echo "ERROR: invalid snapshot '{{ $snapshot }}'. Use: YYYYMMDDTHHMMSSZ" >&2
        exit 1
      fi
{{- end }}

  - action: mmdebstrap
    description: Bootstrap initial filesystem
    suite: {{ $suite }}
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware
{{- if $snapshot }}
    # bootstrap from the snaphot archive
    mirrors: ['https://snapshot.debian.org/archive/debian/{{ $snapshot }}/']
    # a static snapshot's Release may be stale relax the Valid-Until check
    apt-opts: ['Acquire::Check-Valid-Until "false"']
{{- else }}
    mirrors: ['http://deb.debian.org/debian']
{{- end }}
    variant: minbase
    # ca-certificates required in early bootstrap for possible https apt overlays later
    include: [ca-certificates]

{{- if $snapshot }}
  - action: run
    description: Drop mmdebstrap APT configuration
    chroot: false
    command: |
      set -eux
      conf="${ROOTDIR}/etc/apt/apt.conf.d/99mmdebstrap"

      # mmdebstrap persists `apt-opts` in the rootfs

      # Check the generated config only contains the requested options.
      [ -f "$conf" ] || exit 1
      unexpected=$(grep -vFx 'Acquire::Check-Valid-Until "false";' "$conf" || true)
      if [ -n "$unexpected" ]; then
        echo "ERROR: unexpected content in ${conf}: ${unexpected}" >&2
        exit 1
      fi

      # Remove the generated config to not disable `Check-Valid-Until` globally;
      # the later generated snapshot_*.sources config disables it for the
      # relevant sources.
      rm -v "$conf"
{{- end }}

{{- if ne $aptlocalrepo "none" }}
  - action: run
    description: Setup bind mount of local APT repository
    chroot: false
    command: |
      set -eux
      mkdir -v "${ROOTDIR}/media/apt-local-repo"
      mount --bind {{$aptlocalrepo}} "${ROOTDIR}/media/apt-local-repo"

  - action: run
    description: Setup APT sources for local APT repository
    chroot: true
    command: |
      set -eux
      cat >/etc/apt/sources.list.d/apt-local-repo.sources <<EOF
      Types: deb
      URIs: file:///media/apt-local-repo
      Suites: /
      Trusted: true
      EOF
{{- end }}

{{- if $snapshot }}
  - action: run
    description: Install apt-snapshot-toggle into rootfs
    chroot: false
    command: |
      set -eux
      cat > "${ROOTDIR}/usr/local/bin/apt-snapshot-toggle" <<'TOGGLE'
      #!/bin/sh
      mode="$1"
      for f in /etc/apt/sources.list.d/*.sources; do
          case "$f" in
            */snapshot_*) want=$([ "$mode" = "enable" ] && echo yes || echo no) ;;
            *)             want=$([ "$mode" = "enable" ] && echo no  || echo yes) ;;
          esac
          if ! grep -q "^Enabled:" "$f"; then
              echo "Warning: no Enabled: field in ${f}" >&2
          else
              sed -i "s/^Enabled:.*/Enabled: ${want}/" "$f"
          fi
      done
      TOGGLE
      chmod +x "${ROOTDIR}/usr/local/bin/apt-snapshot-toggle"
{{- end }}

  - action: run
    description: Store build metadata in /etc/buildinfo
    chroot: true
    command: |
      set -eux
      touch /etc/buildinfo
      chmod 644 /etc/buildinfo
{{- if $buildid }}
      echo "BUILD_ID={{$buildid}}" >>/etc/buildinfo
{{- end }}
      echo "VARIANT_ID={{$variant}}" >>/etc/buildinfo
{{- if $snapshot }}
      echo "SNAPSHOT={{$snapshot}}" >>/etc/buildinfo
{{- end }}

  # after debootstrap, only a basic etc/apt/sources.list is created; add more
  # modern etc/apt/sources.list.d/*.sources; sources.list is removed after
  # applying all overlays, and followed by an APT update and full-upgrade
  - action: run
    description: Create APT sources for debian {{ $suite }}
    chroot: true
    command: |
      set -eux
      tee /etc/apt/sources.list.d/debian.sources <<EOF
      # Debian archive
      Types: deb
      URIs: http://deb.debian.org/debian/
      Suites: {{ $suite }}
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      Enabled: yes

{{- if ne $suite "unstable" }}

      # Debian stable updates
      Types: deb
      URIs: http://deb.debian.org/debian/
      Suites: {{ $suite }}-updates
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      Enabled: yes

      # Debian security updates
      Types: deb
      URIs: http://deb.debian.org/debian-security/
      Suites: {{ $suite }}-security
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      Enabled: yes
{{- end }}
      EOF

{{- if and (ne $suite "unstable") (ne $suite "testing") }}

{{- /* prefer installing these packages from backports */}}
{{- $backportpackages := list
      "src:alsa-lib:any"
      "src:alsa-ucm-conf:any"
      "src:debugcc:any"
      "src:efivar:any"
      "src:fastrpc:any"
      "src:firmware-free:any"
      "src:firmware-nonfree:any"
      "src:greetd:any"
      "src:hexagon-dsp-binaries:any"
      "src:linux:any"
      "src:linux-signed-arm64:any"
      "src:mesa:any"
      "src:thermald:any"
      "src:u-boot-efi-dtb:any"
      "src:wireplumber:any"
      "src:pipewire:any" }}

  - action: run
    description: Add Debian {{ $suite }}-backports APT configuration
    chroot: true
    command: |
      set -eux
      tee /etc/apt/sources.list.d/debian-backports.sources <<EOF
      # Debian backports
      Types: deb
      URIs: http://deb.debian.org/debian
      Suites: {{ $suite }}-backports
      Components: main contrib non-free non-free-firmware
      Enabled: yes
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      EOF

      tee /etc/apt/preferences.d/debian-backports.pref <<EOF
      # for binary packages built from these source packages, score the version from
      # Debian backports higher as to get hardware enabled or better hardware support

      Package: {{ join " " $backportpackages }}
      Pin: release n={{ $suite }}-backports
      Pin-Priority: 900
      EOF
{{- end }}

{{- if ne $overlays "none" }}
{{- range $overlay := split "," $overlays }}
  - action: overlay
    description: Apply overlay {{$overlay}}
    source: overlays/{{$overlay}}
{{- end }}
{{- end }}

# Qualcomm Linux maintains overlays for trixie/forky
# but only configure the sources when enabled. Some builds (e.g. Vanilla Debian)
# may not want to setup the QLI repo.
{{- if and (eq $qliaptrepo "true") (ne $suite "unstable") }}
  - action: run
    description: Create Qualcomm Linux APT sources for {{ $suite }}
    chroot: true
    command: |
      set -eux
      tee /etc/apt/sources.list.d/qli.sources <<EOF
      # Qualcomm Linux repository
      Types: deb
      URIs: https://deb.debusine.qualcomm.com/qualcomm/qli
      Suites: {{ $suite }}
      Components: main contrib non-free-firmware non-free
      Enabled: yes
      Signed-By:
       -----BEGIN PGP PUBLIC KEY BLOCK-----
       .
       mDMEag8p/xYJKwYBBAHaRw8BAQdAdB6JSNF1OXxnsTgp4VTUekW52BM7e6ZQVRsq
       QT5QDaS0JEFyY2hpdmUgc2lnbmluZyBrZXkgZm9yIHF1YWxjb21tL3FsaYiQBBMW
       CgA4FiEEOwuFfyf8aPE5SQakb8qSvoHfw8IFAmoPKf8CGwMFCwkIBwIGFQoJCAsC
       BBYCAwECHgECF4AACgkQb8qSvoHfw8Lz1gEA9XocADbvqUgZQc0LceThn7vMI98d
       kTJoiInuulQ6rEUBANo+GOKILH71VRnZ5jWtsu7IlVk7oUMlTtC0eE5tcBwB
       =bX6V
       -----END PGP PUBLIC KEY BLOCK-----
      EOF

{{- /* prefer installing these packages from Qualcomm Linux over backports */}}
{{- $qlipackages := list
      "src:alsa-ucm-conf:any"
      "src:fastrpc:any" }}

  - action: run
    description: Add Qualcomm Linux APT preferences for {{ $suite }}
    chroot: true
    command: |
      set -eux
      tee /etc/apt/preferences.d/qli.pref <<EOF
      # for binary packages built from these source packages, score the version
      # from Qualcomm Linux higher than the one from Debian backports

      Package: {{ join " " $qlipackages }}
      Pin: release o=Qualcomm,l=qli
      Pin-Priority: 1000
      EOF
{{- end }}

{{- if $snapshot }}
  - action: run
    description: Derive snapshot_*.sources from live APT sources
    chroot: true
    command: |
      set -eux
      SNAPSHOT=$(grep '^SNAPSHOT=' /etc/buildinfo | cut -d= -f2)
      for src in /etc/apt/sources.list.d/*.sources; do
          name=$(basename "$src" .sources)
          # skip already-derived snapshot files
          case "$name" in snapshot_*) continue ;; esac
          # table: per-source mirror URL (assert) -> snapshot rewrite (sed exprs);
          # sources with no snapshot archive fall through and are skipped
          case "$name" in
            debian)
              assert='http://deb.debian.org/debian'
              set -- \
                -e "s#http://deb\.debian\.org/debian/#https://snapshot.debian.org/archive/debian/${SNAPSHOT}/#g" \
                -e "s#http://deb\.debian\.org/debian-security/#https://snapshot.debian.org/archive/debian-security/${SNAPSHOT}/#g"
              ;;
            debian-backports)
              assert='http://deb.debian.org/debian'
              set -- \
                -e "s#http://deb\.debian\.org/debian\$#https://snapshot.debian.org/archive/debian/${SNAPSHOT}/#"
              ;;
            qli)
              assert='https://deb.debusine.qualcomm.com/qualcomm/qli'
              set -- \
                -e "s#https://deb\.debusine\.qualcomm\.com/qualcomm/qli#&/${SNAPSHOT}#"
              ;;
            *)
              echo "WARNING: skipping apt snapshot for $src" >&2
              continue
              ;;
          esac
          # fail loudly if the upstream mirror URL isn't what we expect
          if ! grep -qF "$assert" "$src"; then
              echo "ERROR: expected mirror '$assert' not found in $src" >&2
              exit 1
          fi
          # rewrite the mirror URL to the dated snapshot archive and disable
          # Check-Valid-Until (snapshots are static, so the Release becomes stale)
          sed "$@" \
              -e "/^Enabled:/a\\# TODO: remove Check-Valid-Until once Debusine-based snapshots are available" \
              -e "/^Enabled:/a\\Check-Valid-Until: no" \
              "$src" > "/etc/apt/sources.list.d/snapshot_${name}.sources"
      done
      apt-snapshot-toggle enable
{{- end }}

  - action: run
    description: Remove old APT sources and upgrade packages
    chroot: true
    command: |
      set -eux
      # remove old style, incomplete sources, superseded in apt-sources overlay
      rm -vf /etc/apt/sources.list
{{- if $snapshot }}
      SNAPSHOT=$(grep '^SNAPSHOT=' /etc/buildinfo | cut -d= -f2)
      for f in /etc/apt/sources.list.d/*.sources; do
          case "$f" in */snapshot_*) continue ;; esac
          if grep -q "^Enabled: yes" "$f"; then
              echo "Warning: $(basename "$f" .sources) has no snapshot support; packages from this source will be the latest available" >&2
          fi
      done
{{- end }}
      # APT update and upgrade to pickup changes from overlays
      apt-get -y update
      apt-get -y full-upgrade

  - action: apt
    description: Install foundational packages
    recommends: true
    packages:
      # vfat tools, notably fsck.fat for the ESP
      - dosfstools
      # ext4 tools, notably e2fsck for the root filesystem
      - e2fsprogs
      # defaults to "systemd-sysv"; perhaps not needed
      - init
      # Ethernet, Wi-Fi, WWAN; built-in DHCP client
      - network-manager
      # standard networking files (/etc/hosts, /etc/services etc.)
      - netbase
      # Qualcomm Remote Filesystem Service; needed for WiFi on
      # some ath10k devices such as on RB1
      - rmtfs
      # the "debian" user below is added to sudoers
      - sudo
      # time sync; correct time is needed to verify TLS certificates (e.g.
      # for APT over HTTPS) on boards without a battery-backed RTC
      - systemd-timesyncd
      # TFTP server implementation for the QRTR protocol; needed for WiFi on
      # some ath10k devices such as on RB1
      - tqftpserv
      # dynamic device nodes handling
      - udev
      # database of radio emission regulations; needed for WiFi
      - wireless-regdb
      # WPA / WPA2 / WPA3 client support
      - wpasupplicant

  - action: run
    description: Set hostname to "debian"
    chroot: true
    command: |
      set -eux
      echo debian >/etc/hostname
      # /etc/hosts is created by netbase
      sed -i "1s/^/127.0.1.1	debian\n/" /etc/hosts

  - action: run
    description: Add a "debian" user, add it to sudoers and various groups
    chroot: true
    command: |
      set -eux
      # pre-emptively create a sudo group if sudo isn't installed
      getent group sudo >/dev/null 2>&1 || groupadd --system sudo
      # some useful groups for desktop scenarios, but also to run payloads
      # from the serial console, over SSH, or in containers - where the desktop
      # session has not updated ACLs to the device nodes
      useradd --create-home --shell /usr/bin/bash --user-group \
          --groups adm,audio,render,sudo,users,video debian
      # set password to "debian"
      echo debian:debian | chpasswd
      # password must be changed on first login
      chage --lastday 0 debian
      # add to sudoers
      mkdir -v --mode 755 --parents /etc/sudoers.d
      # subshell to override umask
      (
        umask 226
        echo "debian ALL=(ALL) NOPASSWD:ALL" >/etc/sudoers.d/90-debos
      )
      # avoid unnecessary sudo hostname lookups
      echo "Defaults !fqdn" >/etc/sudoers.d/disable-fqdn

  # Useful packages on top of the foundational ones above
  - action: apt
    description: Install useful packages
    recommends: true
    packages:
      # Android Debug Bridge (daemon)
      - adbd
      # bluetooth
      - bluez
      # tools to read/write EFI variables
      - efivar
      # support for Qualcomm xDSPs
      - fastrpc-support
      # fwupd tools, enable OTA EFI firmware capsule updates
      - fwupd
      # firmware for the Qualcomm xDSPs
      - hexagon-dsp-binaries
      # Bluetooth audio support in PipeWire
      - libspa-0.2-bluetooth
      # libcamera support in PipeWire
      - libspa-0.2-libcamera
      # audio
      - pipewire
      # power management, notably throttling
      - thermald

{{- if and (eq $qliaptrepo "true") (ne $suite "unstable") }}
  # fastrpc-tests is available from QLI overlays for trixie and forky
  - action: apt
    description: Install fastrpc-tests from QLI overlay
    recommends: true
    packages:
      # fastrpc-tests pulls in fastrpc-support
      - fastrpc-tests

  # userspace-resource-manager is available from QLI overlays for trixie and forky
  - action: apt
    description: Install userspace-resource-manager from QLI overlay
    recommends: true
    packages:
      - userspace-resource-manager
{{- end }}

  # The fastrpc system group used to be created when the fastrpc package was
  # installed, but is now created at boot time from a systemd sysusers.d
  # fragment. Precreate it here from that same fragment so the "debian" user
  # can be added to it.
  - action: run
    description: Add default user to the fastrpc group
    chroot: true
    command: |
      set -eux
      if [ -f /usr/lib/sysusers.d/fastrpc.conf ]; then
          systemd-sysusers /usr/lib/sysusers.d/fastrpc.conf
      fi
      if getent group fastrpc >/dev/null 2>&1; then
          usermod -a -G fastrpc debian
      fi

  # NB: Recommends pull in way too many packages, and we don't need to follow
  # Recommends reaching outside of this Priority level
  - action: apt
    description: Install packages of priority "important" (only from Debian)
    recommends: false
    packages:
      - ?origin(Debian) ?priority(important)

  # NB: Recommends pull in way too many packages, and we don't need to follow
  # Recommends reaching outside of this Priority level
  - action: apt
    description: Install packages of priority "standard" (only from Debian)
    recommends: false
    packages:
      - ?origin(Debian) ?priority(standard)

  # TODO remove Priority: standard packages from this list?
  - action: apt
    description: Install a comfortable package set
    recommends: true
    packages:
      - alsa-utils
      - clinfo
      # used to debug clock issues
      - debugcc
      - device-tree-compiler
      - docker.io
      # used to debug ethernet speed auto-neg issues
      - ethtool
      - i2c-tools
      - locales
      - mesa-opencl-icd
      - mesa-utils-bin
      # convenience networking commands (arp, ifconfig, route etc.)
      - net-tools
      - openssh-client
      # lspci
      - pciutils
      - rfkill
      # lsusb
      - usbutils
      # media-ctl
      - v4l-utils
      - vim
      - vulkan-tools
      - wget

  - action: run
    description: Add default user to docker group
    chroot: true
    command: |
      set -eux
      usermod -a -G docker debian

  - action: run
    description: Set default locale
    chroot: true
    command: |
      set -eux
      if which locale-gen >/dev/null 2>&1; then
          echo en_US.UTF-8 UTF-8 >>/etc/locale.gen
          locale-gen
          update-locale LANG=en_US.UTF-8
      fi

  # Disable initramfs generation until just before the recipe finishes (see
  # "Generate the initramfs for all installed kernels" below). Every later
  # package install (desktop, DKMS) would otherwise trigger a rebuild, and
  # generating it once at the end, after DKMS, ensures DKMS modules are
  # included in it.
  - action: run
    description: Disable initramfs generation until all packages are installed
    chroot: true
    command: |
      set -eux
{{- if eq $suite "trixie" }}
      # Fixes error when running outside qemu
      dpkg-divert --local --rename --add /usr/sbin/update-initramfs
      ln -s /usr/bin/true /usr/sbin/update-initramfs
{{- else }}
      dpkg-divert --local --rename --add /usr/bin/dracut
      ln -s /usr/bin/true /usr/bin/dracut
{{- end }}

  # usually these packages are pulled by Pre-Depends/Depends/Recommends of
  # Debian's linux-image, but kernel packages generated with the upstream
  # deb-pkg target don't have these dependencies, so install these before
  # installing kernels; this is a separate step because of the Pre-Depends
  - action: apt
    description: Install kernel dependencies
    recommends: true
    packages:
      - apparmor
{{- if eq $suite "trixie" }}
      - initramfs-tools
{{- else }}
      - dracut
{{- end }}
      - kmod
      - linux-base

  - action: apt
    description: Install kernel and firmware packages
    recommends: true
    packages:
      - firmware-atheros
      - firmware-qcom-soc
{{- if ne $kernelpackages "none" }}
{{- range $kernelpackage := split "," $kernelpackages }}
      - {{$kernelpackage}}
{{- end }}
{{- end }}

  # this is currently needed on boards such as RB1 which are using Android
  # bootloader to check the boot count of the boot_a/boot_b partitions
  - action: apt
    description: Support boards chainloading from Android bootloader
    recommends: true
    packages:
      # marks the current Android boot partition as booted successfully
      - qbootctl

  - action: recipe
    description: Install variant packages
    recipe: qualcomm-linux-debian-rootfs-variant.yaml
    variables:
      suite: {{ $suite }}
      variant: {{ $variant }}

{{- if ne $localdebs "none" }}
  - action: overlay
    description: Overlay local debs directory {{ $localdebs }} to /root/
    source: {{ $localdebs }}
    destination: /root/

  - action: run
    description: Install local debs from /root/
    chroot: true
    command: |
      set -eux
      apt-get -y install /root/*.deb
      # no need to keep these
      rm -vf /root/*.deb
{{- end }}

{{- if eq $extract_dbg_vmlinux "true" }}
  - action: run
    description: Extract unstripped vmlinux from the kernel -dbg package
    chroot: true
    command: |
      set -eux

      # Images must contain exactly one installed kernel. Fail rather than
      # silently selecting a kernel if the image contains multiple versions.
      kernel_pkgs=$(dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' \
              'linux-image-[0-9]*' |
          sed -n 's/^ii  //p')

      if [ "$(printf '%s\n' "$kernel_pkgs" | sed '/^$/d' | wc -l)" -ne 1 ]; then
          echo "ERROR: Expected exactly one installed kernel, found:" >&2
          printf '%s\n' "$kernel_pkgs" >&2
          exit 1
      fi

      kernel_pkg="$kernel_pkgs"
      kernel_pkgver=$(dpkg-query -W -f='${Version}' "$kernel_pkg")
      kernel_dbgpkg="${kernel_pkg}-dbg"
      kver=${kernel_pkg#linux-image-}

      workdir=/var/tmp/vmlinux-dbg
      rm -rf "$workdir"
      mkdir -p "$workdir"
      cd "$workdir"

      # Not every kernel has a matching debug package. Warn rather than
      # failing the build when one isn't available.
      # APT::Sandbox::User=root avoids a warning about the _apt user not
      # being able to reach this directory.
      if ! apt-get download -o APT::Sandbox::User=root \
              "${kernel_dbgpkg}=${kernel_pkgver}"; then
          echo "WARNING: ${kernel_dbgpkg} package not available;" \
              "can't extract vmlinux" >&2
          rm -rf "$workdir"
          exit 0
      fi
      deb=$(find . -maxdepth 1 -type f -name "${kernel_dbgpkg}_*.deb" \
          -print -quit)

      # Extract the unstripped kernel image only. The debug package also
      # carries debug information for every module, amounting to gigabytes of
      # data that is not needed here. Debian puts vmlinux in
      # /usr/lib/debug/boot/vmlinux-<ver>, while deb-pkg puts it in
      # /usr/lib/debug/lib/modules/<ver>/vmlinux. Match either file name and
      # require exactly one result.
      #
      # tar reports an error for a pattern that matches nothing, so check the
      # extracted files rather than the exit status.
      #
      # --no-same-owner ignores the ownership recorded in the package rather
      # than restoring it, as debos runs this as root.
      dpkg-deb --fsys-tarfile "$deb" |
          tar -x --no-same-owner --no-anchored \
              vmlinux "vmlinux-${kver}" || true
      extracted=$(find . -type f \
          \( -name vmlinux -o -name "vmlinux-${kver}" \))
      # grep counts the non-empty lines, so no match counts as none rather
      # than one.
      count=$(echo "$extracted" | grep -c .)
      if [ "$count" -ne 1 ]; then
          echo "ERROR: expected exactly one vmlinux in ${kernel_dbgpkg}," \
              "found ${count}" >&2
          exit 1
      fi

      # Make sure the extracted image belongs to the kernel the package is
      # named after, and not to a different one it happens to carry.
      case "$extracted" in
        */"${kver}"/vmlinux|*/"vmlinux-${kver}")
          ;;
        *)
          echo "ERROR: ${extracted} from ${kernel_dbgpkg} doesn't match" \
              "kernel ${kver}" >&2
          exit 1
          ;;
      esac

      mv -v "$extracted" "$workdir/vmlinux"
      rm -v "$deb"

  - action: run
    description: Move vmlinux to the artifact directory
    chroot: false
    command: |
      set -eux
      workdir="${ROOTDIR}/var/tmp/vmlinux-dbg"
      if [ -f "${workdir}/vmlinux" ]; then
          mv -v "${workdir}/vmlinux" "${ARTIFACTDIR}/vmlinux"
          # debos runs as root, so leave the image to whoever owns the
          # directory it was written to rather than to root; a build
          # directory usually belongs to the user who started the build.
          chown --reference="${ARTIFACTDIR}" "${ARTIFACTDIR}/vmlinux" \
              2>/dev/null || true
      fi
      rm -rf "$workdir"
{{- end }}

  # All packages are installed by this point, so re-enable initramfs
  # generation (see "Disable initramfs generation until all packages are
  # installed" above) and generate it once here, for every installed kernel.
  - action: run
    description: Generate the initramfs for all installed kernels
    chroot: true
    command: |
      set -eux
{{- if eq $suite "trixie" }}
      rm /usr/sbin/update-initramfs
      dpkg-divert --rename --remove /usr/sbin/update-initramfs
      update-initramfs -c -k all
{{- else }}
      rm /usr/bin/dracut
      dpkg-divert --rename --remove /usr/bin/dracut
      dracut --regenerate-all --force
{{- end }}

{{- if ne $aptlocalrepo "none" }}
  - action: run
    description: Remove bind mount of local APT repository
    chroot: false
    command: |
      set -eux
      umount "${ROOTDIR}/media/apt-local-repo"
      rmdir -v "${ROOTDIR}/media/apt-local-repo"

  - action: run
    description: APT update without local APT repository
    chroot: true
    command: |
      set -eux
      rm -v /etc/apt/sources.list.d/apt-local-repo.sources
      apt-get update
{{- end }}

{{- if $snapshot }}
  - action: run
    description: Restore APT sources to live mirrors
    chroot: true
    command: |
      set -eux
      apt-snapshot-toggle disable
{{- end }}

  - action: run
    description: Create DTBs tarball
    chroot: false
    command: |
      set -eux
      # find the highest kernel version installed; kernels are backwards
      # compatible with older dtbs, so it would make sense to take dtbs from
      # the oldest available kernel as to allow all kernels to boot, but if
      # this image has pulled a more recent kernel, it's probably to gain
      # support for new hardware which would happen through new or updated dtbs
      # only in that new kernel, so use the latest dtbs
      # list kernel directories to avoid silent pipeline failure
      kernel_dirs=$(ls -d "$ROOTDIR"/usr/lib/linux-image-*)
      latest_kernel=$(echo "$kernel_dirs" | sort -V | tail -1)
      # transform pathnames to strip the leading ./
      tar \
          -C "${latest_kernel}" \
          --transform='s|^\./||' \
          -cvzf "$ARTIFACTDIR/dtbs.tar.gz" \
          .

  - action: pack
    description: Create root filesystem tarball
    file: rootfs.tar
    compression: none

