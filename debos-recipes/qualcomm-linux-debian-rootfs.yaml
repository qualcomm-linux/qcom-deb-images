{{- if eq $westonsession "true" }}
# Install Weston, a lightweight Wayland compositor.
#
# The Weston package does not have any mechanism to start automatically at boot
# so greetd is used to create a user session and start Weston.
#
# The agreety text greeter provides a console login interface similar to getty,
# authenticates the user through PAM then launches Weston after login.
#
# greetd/agreety does not discover the installed compositors from
# /usr/share/wayland-sessions/*.desktop so Weston is set as the command to run
# after login.
#
# Weston logs to "$XDG_RUNTIME_DIR/weston.log", XDG_RUNTIME_DIR usually resolves
# to "/run/user/<UID>", so the log is only kept for the lifetime of the user's
# login session.
#
# greetd is configured through /etc/greetd/weston-session.toml rather than
# /etc/greetd/config.toml - the latter is a dpkg conffile shipped by the
# greetd package and may be overwritten on package upgrades.

  - action: apt
    description: Install Weston session packages
    recommends: false
    packages:
      - weston
      - greetd

  - action: overlay
    description: Configure Weston session
    source: overlays/weston-session
{{- end }}

  - action: run
    description: Set default locale
    chroot: true
    command: |
      set -eux
      if which locale-gen >/dev/null 2>&1; then
          echo en_US.UTF-8 UTF-8 >>/etc/locale.gen
          locale-gen
          update-locale LANG=en_US.UTF-8
      fi

  # usually these packages are pulled by Pre-Depends/Depends/Recommends of
  # Debian's linux-image, but kernel packages generated with the upstream
  # deb-pkg target don't have these dependencies, so install these before
  # installing kernels; this is a separate step because of the Pre-Depends
  - action: apt
    description: Install kernel dependencies
    recommends: true
    packages:
      - apparmor
{{- if eq $suite "trixie" }}
      - initramfs-tools
{{- else }}
      - dracut
{{- end }}
      - kmod
      - linux-base

  - action: apt
    description: Install kernel and firmware packages
    recommends: true
    packages:
      - firmware-atheros
      - firmware-qcom-soc
{{- if ne $kernelpackages "none" }}
{{- range $kernelpackage := split "," $kernelpackages }}
      - {{$kernelpackage}}
{{- end }}
{{- end }}

  # this is currently needed on boards such as RB1 which are using Android
  # bootloader to check the boot count of the boot_a/boot_b partitions
  - action: apt
    description: Support boards chainloading from Android bootloader
    recommends: true
    packages:
      # marks the current Android boot partition as booted successfully
      - qbootctl

{{- if eq $multimedia "true" }}
# Install the accelerated multimedia stack: out-of-tree kernel drivers and
# closed source user-space from the Qualcomm Linux APT repository.

{{- if ne $qliaptrepo "true" }}
# Call an unexisting template to err out of the recipe
{{ template "ERR" }}
{{- end }}

  - action: apt
    description: Install DKMS
    packages:
      - gcc
      - dkms

  # CI does not use fakemachine. Limit DKMS build parallelism when
  # running under fakemachine, where the default 1GB memory can be exhausted
  # by multiple compiler jobs running in parallel.
  # $IN_FAKE_MACHINE is only set when not running in chroot.
  - action: run
    description: Configure DKMS for low-memory fakemachine builds
    chroot: false
    command: |
      set -eux
      if [ "${IN_FAKE_MACHINE:-}" = "yes" ]; then
        mkdir -p "${ROOTDIR}/etc/dkms/framework.conf.d"
        echo "parallel_jobs=1" > "${ROOTDIR}/etc/dkms/framework.conf.d/fakemachine.conf"
      fi

  - action: apt
    description: Install accelerated multimedia stack
    recommends: false
    packages:
      # Adreno GPU driver
      - kgsl-dkms
      - adreno-gles2
      - adreno-egl1
      - libgbm-msm1
      - adreno-opencl-icd
      - adreno-vulkan-icd

      # CamX - only firmware available for now
      # camx-dkms fails to build in fakemachine; see https://github.com/qualcomm-linux/pkg-camx-dkms/pull/42
      #- camx-dkms
      - camx-firmware-glymur
      - camx-firmware-hamoa

      # Iris Video Processing Unit
      - iris-vpu-dkms

  - action: run
    description: Remove temporary DKMS configuration
    chroot: true
    command: |
      set -eux
      rm -rf /etc/dkms/framework.conf.d/fakemachine.conf
{{- end }}

{{- if ne $localdebs "none" }}
  - action: overlay
    description: Overlay local debs directory {{ $localdebs }} to /root/
    source: {{ $localdebs }}
    destination: /root/

  - action: run
    description: Install local debs from /root/
    chroot: true
    command: |
      set -eux
      apt-get -y install /root/*.deb
      # no need to keep these
      rm -vf /root/*.deb
{{- end }}

{{- if ne $aptlocalrepo "none" }}
  - action: run
    description: Remove bind mount of local APT repository
    chroot: false
    command: |
      set -eux
      umount "${ROOTDIR}/media/apt-local-repo"
      rmdir -v "${ROOTDIR}/media/apt-local-repo"

  - action: run
    description: APT update without local APT repository
    chroot: true
    command: |
      set -eux
      rm -v /etc/apt/sources.list.d/apt-local-repo.sources
      apt-get update
{{- end }}

{{- if $snapshot }}
  - action: run
    description: Restore APT sources to live mirrors
    chroot: true
    command: |
      set -eux
      apt-snapshot-toggle disable
{{- end }}

  - action: run
    description: Create DTBs tarball
    chroot: false
    command: |
      set -eux
      # find the highest kernel version installed; kernels are backwards
      # compatible with older dtbs, so it would make sense to take dtbs from
      # the oldest available kernel as to allow all kernels to boot, but if
      # this image has pulled a more recent kernel, it's probably to gain
      # support for new hardware which would happen through new or updated dtbs
      # only in that new kernel, so use the latest dtbs
      # list kernel directories to avoid silent pipeline failure
      kernel_dirs=$(ls -d "$ROOTDIR"/usr/lib/linux-image-*)
      latest_kernel=$(echo "$kernel_dirs" | sort -V | tail -1)
      # transform pathnames to strip the leading ./
      tar \
          -C "${latest_kernel}" \
          --transform='s|^\./||' \
          -cvzf "$ARTIFACTDIR/dtbs.tar.gz" \
          .

  - action: pack
    description: Create root filesystem tarball
    file: rootfs.tar
    compression: none

