{{- $buildid := or .buildid "" }}
{{- $target_boards := or .target_boards "all" }}
{{- $u_boot_rb1 := or .u_boot_rb1 "" }}

architecture: arm64

actions:
  - action: download
    description: Download qcom-ptool
    url: https://github.com/qualcomm-linux/qcom-ptool/archive/b147606c32b7d29148eca16fbe071f9420dd51a9.tar.gz
    name: qcom-ptool
    filename: qcom-ptool.tar.gz
    sha256sum: a9fb80e1e03400d228c784a12c55de66ff7144ec8f07732f0dff332b33ead242
    unpack: true

  - action: download
    description: Download qcom-dtb-metadata (DTB image build scripts and ITS/metadata files)
    url: https://github.com/qualcomm-linux/qcom-dtb-metadata/archive/d30e9cdb766f08b05160ededf53556ed665d0c0b.tar.gz
    name: qcom-dtb-metadata
    filename: qcom-dtb-metadata.tar.gz
    sha256sum: a43ccf98149658352a74c54cac1455c35b44e7d48798dc0072540604ec475ae9
    unpack: true

  # The board definitions live in boards.yaml rather than in this recipe:
  # debos actions are fixed once the recipe is templated, so per-board download
  # actions would have to be emitted for every board and could not be filtered
  # by target_boards. gen-flash-dirs.py selects the requested boards first and
  # only then downloads and builds what they need.
  - action: run
    description: Generate flash directories for eMMC and UFS boards
    chroot: false
    command: |
      set -eux
      "${RECIPEDIR}/../scripts/gen-flash-dirs.py" \
          --boards "${RECIPEDIR}/../boards.yaml" \
          --download-dir "${ROOTDIR}/.." \
          --artifact-dir "${ARTIFACTDIR}" \
          --scripts-dir "${RECIPEDIR}/../scripts" \
          --work-dir build \
          --target-boards "{{ $target_boards }}" \
          --buildid "{{ $buildid }}" \
          --template-var "u_boot_rb1={{ $u_boot_rb1 }}"

