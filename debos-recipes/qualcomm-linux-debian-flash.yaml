{{- $build_qcs615 := or .build_qcs615 "true" }}
{{- $build_qcm6490 := or .build_qcm6490 "true" }}
{{- $build_qcs8300 := or .build_qcs8300 "true" }}
{{- $build_qcs9100 := or .build_qcs9100 "true" }}
{{- $build_rb1 := "false" -}}
{{- if .u_boot_rb1 -}}
{{- $build_rb1 = "true" }}
{{- end -}}
{{- $buildid := or .buildid "" }}

{{- $target_boards := or .target_boards "all" }}

architecture: arm64

actions:
  - action: download
    description: Download qcom-ptool
    url: https://github.com/qualcomm-linux/qcom-ptool/archive/b147606c32b7d29148eca16fbe071f9420dd51a9.tar.gz
    name: qcom-ptool
    filename: qcom-ptool.tar.gz
    sha256sum: a9fb80e1e03400d228c784a12c55de66ff7144ec8f07732f0dff332b33ead242
    unpack: true

  - action: download
    description: Download qcom-dtb-metadata (DTB image build scripts and ITS/metadata files)
    url: https://github.com/qualcomm-linux/qcom-dtb-metadata/archive/d30e9cdb766f08b05160ededf53556ed665d0c0b.tar.gz
    name: qcom-dtb-metadata
    filename: qcom-dtb-metadata.tar.gz
    sha256sum: a43ccf98149658352a74c54cac1455c35b44e7d48798dc0072540604ec475ae9
    unpack: true

# soc_id identifies the SoC/SKU each board is built on, using the same
# names as qcom-dtb-metadata's /soc node (qcom-metadata.dts), so --soc
# can select the FIT image configs for the boards this repo supports.
# Values are derived from IPCAT and verified against the kernel's
# include/dt-bindings/arm/qcom,ids.h QCOM_ID_* constants.
{{- $boards := list }}
{{- $boards = append $boards (dict
    "name" "glymur-crd"
    "soc_id" "glymur"
    "ptool_platforms" (list "glymur-crd/nvme" "glymur-crd/spinor")
    "boot_binaries_download" (dict
        "description" "Glymur boot binaries"
        "url" "https://softwarecenter.qualcomm.com/nexus/generic/product/chip/tech-package/Glymur_bootbinaries.1.0/glymur_bootbinaries.1.0-test-device-public/00080/Glymur_bootbinaries.zip"
