# greetd configuration for the Weston session.
[terminal]
vt = 7

[default_session]
# Start agreety to provide a login prompt, then launch Weston.
# Run Weston under systemd-cat so its log (written to stderr) goes to the
# journal and outlives the user's login session; view it with
# "journalctl -t weston".
command = "/usr/sbin/agreety --cmd 'systemd-cat --identifier=weston weston'"
user = "_greetd"
