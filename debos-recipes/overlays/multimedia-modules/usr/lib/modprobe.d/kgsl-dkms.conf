# Always load msm with skip_gpu=1 so the DRM msm driver does not bind to the
# GPU device node, leaving it free for the KGSL driver to claim.
options msm skip_gpu=1
# After msm is loaded (with skip_gpu=1), automatically pull in msm_kgsl so
# the KGSL driver can probe the GPU before the DRM msm adreno driver does.
softdep msm post: msm_kgsl
