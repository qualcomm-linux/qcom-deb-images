# Calamares shellprocess job, which 0060-calamares.hook.chroot runs after
# the initramfs job. Runs the same post-install steps as d-i's
# preseed/late_command (see live-build/postinst/postinst.sh) on the
# target, from the stick's /qli/, which live-boot mounts at
# /run/live/medium.
---
dontChroot: true
timeout: 600
script:
  - "sh /run/live/medium/qli/postinst.sh ${ROOT} /run/live/medium/qli"
