# Pick GNOME as the default desktop.
# tasksel defaults to Xfce on every arch but i386/amd64 (see
# default_desktop_for_arch in tasksel), as not all of them have 3D hardware.
# These devices do, so tick GNOME instead. This only changes which
# desktop is ticked: the task selection is still asked.
tasksel tasksel/desktop multiselect gnome
