### Networking
# Prefer an interface with an active link, such as USB Ethernet, over a
# detected but unsupported Wi-Fi adapter. Allow extra time for USB network
# adapters to initialise before checking for a link.
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10

# If automatic network configuration fails, continue offline.
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Do not configure the network at this time

### Mirror
# Use the configured Debian mirror when networking is available.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Use the network mirror for the installed system's apt sources, so the
# mirror, updates and backports entries are added, and tasksel can offer
# tasks whose packages are not on the ISO.
d-i apt-setup/use_mirror boolean true

# netcfg/dhcp_options above stays set even when DHCP succeeds, and
# apt-setup takes it to mean there is no network: it skips the mirror and
# comments out security, updates and backports. Partitioning runs after
# netcfg and before apt-setup, so fix both up there: with a default route,
# clear dhcp_options; without one, turn the mirror off so choose-mirror
# doesn't stop at "Bad archive mirror".
d-i partman/early_command string if ip route show default | grep -q .; then debconf-set netcfg/dhcp_options ""; else debconf-set apt-setup/use_mirror false; fi

# Allow installation to continue without a network mirror.
d-i apt-setup/no_mirror boolean true
