# Install the files from the ISO's /qli/ that no package ships (initramfs
# hooks, APT pins, the Stubble kernel hooks and grub.d script) and rebuild
# the initrds, Stubble images and grub.cfg: see
# live-build/postinst/postinst.sh. late_command
# runs after GRUB is installed, while the ISO is still mounted at /cdrom.
# Packaging these files would make it unnecessary.
d-i preseed/late_command string sh /cdrom/qli/postinst.sh /target
