# Install the Stubble kernel hooks from the ISO's /qli/, which no package
# ships, and wrap the target's kernel in Stubble: see
# live-build/postinst/postinst.sh. late_command runs after GRUB is
# installed, while the ISO is still mounted at /cdrom. Packaging these
# files would make it unnecessary.
d-i preseed/late_command string sh /cdrom/qli/postinst.sh /target
