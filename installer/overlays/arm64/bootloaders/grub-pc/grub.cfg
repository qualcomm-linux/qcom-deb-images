# Replaces live-build's grub-pc/grub.cfg template (see
# /usr/share/live/build/bootloaders/grub-pc/grub.cfg). Drops the live
# system entries (there is no live kernel, --linux-packages none), the
# stock "Start installer" entries from install_start.cfg and the stock
# install.cfg advanced entries; the QLI entries are inserted in their place
# by 0100-qcom-laptop-boot.hook.binary.
source /boot/grub/config.cfg

# live-build's theme.cfg only selects the live-theme when
# /boot/grub/splash.png exists, which binary_bootloader_splash doesn't
# create for hdd images (no BIOS/EFI bootloader is configured); select it
# here. The theme draws bg.png, not splash.png.
if [ -e /boot/grub/live-theme/theme.txt ]; then
	set theme=/boot/grub/live-theme/theme.txt
fi

# Boot the default entry after 30s; the theme's __timeout__ progress bar
# shows the countdown.
# set timeout=30

# QLI_ENTRIES

# Firmware setup (UEFI)
if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI Firmware Settings" --hotkey=f {
		fwsetup
	}
fi
