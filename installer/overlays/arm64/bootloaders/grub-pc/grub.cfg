# Replaces live-build's grub-pc/grub.cfg template (see
# /usr/share/live/build/bootloaders/grub-pc/grub.cfg). Drops the stock live
# system entries (lb has no live kernel to list, --linux-packages none), the
# stock "Start installer" entries from install_start.cfg and the stock
# install.cfg advanced entries; the QLI entries, including the live system's
# for the live installer type, are inserted in their place by
# 0110-grub-menu.hook.binary.
source /boot/grub/config.cfg

# live-build's theme.cfg only selects the live-theme when
# /boot/grub/splash.png exists, which binary_bootloader_splash doesn't
# create for hdd images (no BIOS/EFI bootloader is configured); select it
# here. The theme draws bg.png, not splash.png.
if [ -e /boot/grub/live-theme/theme.txt ]; then
	set theme=/boot/grub/live-theme/theme.txt
fi

# Boot the default entry after 10s; the theme's __timeout__ progress bar
# shows the countdown.
set timeout=10

# QLI_ENTRIES

# Debugging tools. The hook fills QLI_ADVANCED_ENTRIES with the installer
# entries booted with chainloader. The UEFI shell is only on the image when
# build.sh got --uefi-shell, as CI does.
submenu 'Advanced options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	# A submenu doesn't inherit $theme, and theme.cfg doesn't set it on hdd
	# images (see above).
	if [ -e /boot/grub/live-theme/theme.txt ]; then
		set theme=/boot/grub/live-theme/theme.txt
	fi

# QLI_ADVANCED_ENTRIES

	if [ -f /EFI/tools/shellaa64.efi ]; then
		menuentry 'UEFI Shell' --hotkey=s {
			chainloader /EFI/tools/shellaa64.efi
		}
	fi
}

# Firmware setup (UEFI)
if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI Firmware Settings" --hotkey=f {
		fwsetup
	}
fi
