# Preseed for the "Automated install" boot menu entry.
#
# Only that entry reads this file, from the root of the installer's USB
# stick (/cdrom/automated-install-preseed.cfg). It boots the graphical
# installer at critical priority, so the installer takes the default answer
# where there is one and only asks what this file leaves unanswered and has
# no default. As shipped, it answers only what is the same for everyone:
# network, mirror, clock and popularity-contest. Whatever is personal (locale,
# keyboard, host name, user, time zone) or destructive (partitioning) is
# commented out: edit the file on the stick and uncomment what you want
# answered. Answering everything gives an unattended install.
#
# WARNING: the partitioning answers below erase the chosen disk without
# asking.
#
# The installer's own preseed (built into its initrd) is loaded first; this
# file is loaded after it and can override it. Don't set
# preseed/late_command, pkgsel/include, base-installer/kernel/image or the
# apt-setup services and local* repositories here: the build sets them to
# install the custom kernel, firmware, Stubble and the laptop's boot files,
# and this file would replace them.
#
# For the full list of settings, see the Debian installation guide's
# example preseed: https://www.debian.org/releases/stable/example-preseed.txt

### Localisation
# Language, country and locale of the installed system.
d-i debian-installer/locale string en_US.UTF-8
# Keyboard layout.
d-i keyboard-configuration/xkb-keymap select us

### Network
# Pick the network interface automatically: a wired one with a link if there
# is one.
#d-i netcfg/choose_interface select auto
# Without a network (no cable plugged in), carry on without asking. These are
# only asked when DHCP fails, so a wired connection is still used.
#d-i netcfg/dhcp_failed note
#d-i netcfg/dhcp_options select Do not configure the network at this time
# Hostname and domain, used unless DHCP provides them.
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string
# Wi-Fi network, when there's no wired one. Anyone with the USB stick can
# read this file, so don't leave a passphrase you care about on it.
#d-i netcfg/wireless_essid string my-network
#d-i netcfg/wireless_security_type select wpa
#d-i netcfg/wireless_wpa string my-passphrase

### Clock and time zone
# The hardware clock is in UTC.
d-i clock-setup/utc boolean true
# Time zone (see /usr/share/zoneinfo).
d-i time/zone string UTC
# Set the clock from NTP during the install.
d-i clock-setup/ntp boolean true

### User account
# The root account is disabled and the first user gets sudo
# (no-root-login.cfg in the installer's preseed).
d-i passwd/user-fullname string User
d-i passwd/username string debian
# The user's password, in clear text...
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian
# ...or crypted, e.g. from "mkpasswd -m sha-512".
#d-i passwd/user-password-crypted password [crypt(3) hash]
# Accept a weak password without asking.
d-i user-setup/allow-password-weak boolean true

### Partitioning
# The disk to install to, erased without asking. Name it explicitly, so the
# installer never picks the USB stick: on these devices the internal
# disk is usually NVMe.
#d-i partman-auto/disk string /dev/nvme0n1
# Plain partitions, rather than LVM or encrypted LVM ("lvm", "crypto").
#d-i partman-auto/method string regular
# Layout: everything in one partition ("atomic"), separate /home ("home"),
# or separate /home, /var and /tmp ("multi").
#d-i partman-auto/choose_recipe select atomic
# Remove any old LVM or RAID on the disk without asking.
#d-i partman-lvm/device_remove_lvm boolean true
#d-i partman-md/device_remove_md boolean true
#d-i partman-lvm/confirm boolean true
#d-i partman-lvm/confirm_nooverwrite boolean true
# Write the new partition table and partitions without asking.
#d-i partman-partitioning/confirm_write_new_label boolean true
#d-i partman/choose_partition select finish
#d-i partman/confirm boolean true
#d-i partman/confirm_nooverwrite boolean true

### Mirror
# The Debian mirror the installed system uses, with the network mirror the
# installer's preseed enables (network-mirror.cfg). "manual" skips the
# country list.
#d-i mirror/country string manual
#d-i mirror/http/hostname string deb.debian.org
#d-i mirror/http/directory string /debian
# HTTP proxy for APT; leave it empty for none.
#d-i mirror/http/proxy string
# Without a network, skip the network mirror instead of failing to reach it.
# The installer's preseed turns the mirror on (network-mirror.cfg), so turn it
# off here once netcfg has finished, if there's no default route. Partitioning
# runs after netcfg and before apt-setup.
#d-i partman/early_command string ip route show default | grep -q . || debconf-set apt-setup/use_mirror false
# If the mirror still can't be reached, continue without it.
#d-i apt-setup/no_mirror boolean true

### Software
# Tasks to install. The installer's preseed only ticks GNOME as the desktop
# (tasksel-default-desktop.cfg); this answers the task selection too.
tasksel tasksel/first multiselect desktop, gnome-desktop, standard
# To install Xfce instead:
#tasksel tasksel/first multiselect desktop, xfce-desktop, standard
# Don't take part in the package popularity contest.
popularity-contest popularity-contest/participate boolean false

### Boot loader
# Install GRUB without asking, even if other operating systems are found.
#d-i grub-installer/only_debian boolean true

### Finishing up
# Reboot without the "Installation complete" message.
#d-i finish-install/reboot_in_progress note
