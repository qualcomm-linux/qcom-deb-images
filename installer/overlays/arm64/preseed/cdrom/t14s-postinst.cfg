# TODO: temporary workaround, remove along with /qli/t14s-dtb.sh on the
# ISO (overlays/arm64/includes.binary/qli/). Adds the ISO's x1e80100
# firmware to the installed system and its initrd, copies the T14s DTB to
# /boot and adds it to the installed system's grub.cfg, since Debian's GRUB
# doesn't load a devicetree. late_command runs after GRUB is installed, while
# the ISO is still mounted at /cdrom.
