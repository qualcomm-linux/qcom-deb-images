# Install the files from the ISO's /qli/ that no package ships (initramfs
# hooks, APT pins, the Stubble kernel hooks and grub.d script) and rebuild
# the initrds, Stubble images and grub.cfg: see
# overlays/arm64/includes.binary/qli/qcom-laptop-postinst.sh. late_command
# runs after GRUB is installed, while the ISO is still mounted at /cdrom.
# Packaging these files would make it unnecessary.
d-i preseed/late_command string sh /cdrom/qli/qcom-laptop-postinst.sh /target

# Debian's default MODULES=most initrd, together with the uncompressed
# kernel in the Stubble image, makes the X1E firmware fail
# ExitBootServices; a targeted initrd keeps the boot footprint small.
# base-installer writes this to the target's initramfs.conf, so the
# late_command's rebuilds use it too.
d-i base-installer/initramfs-tools/driver-policy string dep
