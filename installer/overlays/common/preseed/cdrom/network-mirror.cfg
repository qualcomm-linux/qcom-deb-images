# Use a network mirror as well as the ISO's pool, so apt sources on the
# installed system point at the mirror, and tasksel offers the tasks whose
# packages aren't on the ISO (desktops etc.). Needs apt-mirror-setup, which
# scripts/build.sh keeps on the ISO. Without a network, apt-setup reports that
# the mirror can't be reached and offers to continue without it.
d-i apt-setup/use_mirror boolean true
