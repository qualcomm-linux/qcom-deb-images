# Skip the root password step: disable the root account and give the first
# user sudo instead, like Ubuntu. Users who leave the root password blank
# get this anyway, but many users set one without realising they then get
# no sudo, and are stuck unable to administer the system from their own
# account.
# TODO: the first user only gets working sudo if user-setup can install
# sudo, from the ISO's pool or the network mirror: check it's in the pool.
d-i passwd/root-login boolean false
