# Inventory of the boards this repository supports.
#
# Consumed by scripts/gen-flash-dirs.py on behalf of
# debos-recipes/qualcomm-linux-debian-flash.yaml, which builds a flash
# directory for each board named in its target_boards template variable.
#
# soc_id identifies the SoC/SKU each board is built on, using the same names as
# qcom-dtb-metadata's /soc node (qcom-metadata.dts), so --soc can select the FIT
# image configs for the boards this repo supports. Values are derived from IPCAT
# and verified against the kernel's include/dt-bindings/arm/qcom,ids.h
# QCOM_ID_* constants.
#
# dtb_bin_type is either multidtb (a per-SoC dtb-multidtb-<soc>.bin FIT image
# shared at the artifact directory level) or combineddtb (a dtb-combineddtb.bin
# holding this board's single DTB, local to its flash directory).

boards:
  - name: glymur-crd
    soc_id: glymur
    dtb: qcom/glymur-crd.dtb
    dtb_bin_type: multidtb
    ptool_platforms:
      - glymur-crd/nvme
      - glymur-crd/spinor
    boot_binaries:
      description: Glymur boot binaries
      url: https://softwarecenter.qualcomm.com/nexus/generic/product/chip/tech-package/Glymur_bootbinaries.1.0/glymur_bootbinaries.1.0-test-device-public/00080/Glymur_bootbinaries.zip
      filename: glymur_boot-binaries.zip
      sha256sum: "82abec551e305643ec0acfd9bff77b6fc27c410220ef0ce4b0bce30d268387de"
    cdt:
      description: Glymur CRD CDT
      url: https://artifacts.codelinaro.org/artifactory/codelinaro-le/Qualcomm_Linux/SC8480XP/cdt/sc8480xp-crd.zip
      filename: glymur-crd_cdt.zip
      sha256sum: "d694eedb0addcc5ee588d6993661cd23996fba1d1a43afc3b196dad12534bffc"
      file: CRD/cdt_glymur_crd_0.1.0.bin

