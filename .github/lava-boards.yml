# Boards tested per kernel flavour.
#
# A name is a device in the qcom-deb-images project of lava-test-plans, named
# after its device tree; it is also the LAVA device type and the device key of
# .github/known-failures/.
#
# boot      boards the image is flashed and booted on
# premerge  boards the qcom-linux-testkit tests run on; empty means every board
#           in boot that booted

qcom-next:
  boot:
    - glymur-crd
    - qcs615-ride
    - qcs6490-rb3gen2
    - qcs8300-ride
    - qrb2210-rb1

qcom-7.2:
  boot:
    - glymur-crd

qcom-laptops:
  boot:
    - glymur-crd

arduino:
  boot:
    - monaco-arduino-monza
    - monaco-evk
    - qrb2210-arduino-imola

linux-next:
  boot:
    - glymur-crd
    - qcs6490-rb3gen2
    - qrb2210-rb1

debian:
  boot:
    - qcs615-ride
    - qcs6490-rb3gen2
    - qrb2210-rb1

mainline:
  boot:
    - glymur-crd
    - qcs6490-rb3gen2
    - qrb2210-rb1
