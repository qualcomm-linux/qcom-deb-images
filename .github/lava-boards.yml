# Boards tested per kernel flavour.
#
# A name is a device in the qcom-deb-images project of lava-test-plans, named
# after its device tree; it is also the LAVA device type and the device key of
# .github/known-failures/.
#
# boot      boards the image is flashed and booted on
# premerge  boards the qcom-linux-testkit tests run on; empty means every board
#           in boot that booted

qcom-next:
  boot:
    - eliza-cqs-evk-emmc
    - glymur-crd
    - kaanapali-mtp
    - mahua-crd
    - monaco-evk
    - purwa-iot-evk
    - qcs615-ride
    - qcs6490-rb3gen2
    - qcs9100-ride-r3
    - qrb2210-rb1

qcom-7.3:
  boot:
    - glymur-crd

qcom-laptops:
  boot:
    - glymur-crd

arduino:
  # early/hwe/arduino is for the UNO Q and VENTUNO Q boards; monaco-evk is
  # left out, as the branch lacks the fixes for its UFS boot failure:
  # https://github.com/qualcomm-linux/kernel/issues/758
  # https://github.com/qualcomm-linux/kernel-topics/pull/1951
  # https://github.com/qualcomm-linux/kernel-topics/pull/1977
  boot:
    - monaco-arduino-monza
    - qrb2210-arduino-imola

linux-next:
  # monaco-evk is left out until the fixes for its UFS boot failure are
  # merged upstream:
  # https://github.com/qualcomm-linux/kernel/issues/758
  # https://github.com/qualcomm-linux/kernel-topics/pull/1951
  # https://github.com/qualcomm-linux/kernel-topics/pull/1977
  boot:
    - glymur-crd
    - qcs6490-rb3gen2
    - qrb2210-rb1

debian:
  boot:
    - qcs615-ride
    - qcs6490-rb3gen2

mainline:
  # monaco-evk is left out until the fixes for its UFS boot failure are
  # merged upstream:
  # https://github.com/qualcomm-linux/kernel/issues/758
  # https://github.com/qualcomm-linux/kernel-topics/pull/1951
  # https://github.com/qualcomm-linux/kernel-topics/pull/1977
  boot:
    - glymur-crd
    - qcs6490-rb3gen2
