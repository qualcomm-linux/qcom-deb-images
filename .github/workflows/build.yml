# Builds & Tests QLI Debian images:
#  - qcom-next kernel
#  - Qualcomm overlay repos and packages
#
# This workflow tracks the state of QLI Debian on supported boards.

name: Build

# runs once the daily qcom-next kernel build is done, so that the images are
# built from the debs it has just published to EFS; this also runs when that
# build fails, in which case EFS still holds the previous kernel debs and the
# images are worth building and testing anyway.
#
# workflow_run is required to chain onto that build: it is the only trigger
# that fires when another workflow completes. The triggering workflow only
# runs from schedule or workflow_dispatch on main of this repository, so its
# event payload is never attacker-controlled, the jobs below are additionally
# guarded on the repository and ref. Nothing here checks out or executes
# code from the triggering run, so the usual workflow_run privilege-escalation
# route does not apply.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["qcom-next linux build"]
    types:
      - completed
  # allow manual runs
  workflow_dispatch:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    # don't run from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
        variant: [default, weston-multimedia]
    uses: ./.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant }}
      # QLI targets qcom-next; consume the debs published to EFS by the
      # "qcom-next linux build" workflow rather than a kernel from an
      # APT repository
      kernelpackages: efs/qcom-next

  # snapshot builds pin the APT sources to a dated archive (see
  # docs/snapshot.md); they have their own code paths in the rootfs and image
  # recipes which nothing else exercises, so build an image with them every
  # day. it runs here rather than on pull requests because it is a full image
  # build and snapshot.debian.org is slower and more rate-limited than the
  # regular mirrors.
  #
  # this only ever answers "do the snapshot code paths still work?": the images
  # are not published and no LAVA job boots them, the build going green and the
  # QEMU tests ran by debos.yml are the coverage we're after. the default
  # variant is enough, as the snapshot code paths don't depend on it.
  build-snapshot:
    # don't run from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: ./.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      # both the rootfs and the image recipe re-pin their own APT sources, and
      # debos_extra_args is passed to both.
      #
      # any well-formed timestamp resolves to the publication which was live at
      # that moment, so this is a fixed date rather than something computed: it
      # keeps the build reproducible and makes a failure a change in our
      # recipes rather than a change in the archives. bump it when it gets old
      # enough that the archives no longer serve it well.
      debos_extra_args: -t snapshot:20260810T082104Z
      # nothing consumes these images, so don't spend the time compressing
      # them nor the storage keeping them around
      upload_artifacts: false
      # QLI targets qcom-next; consume the debs published to EFS by the
      # "qcom-next linux build" workflow rather than a kernel from an
      # APT repository. note that a local kernel is not covered by the
      # snapshot, see docs/snapshot.md
      kernelpackages: efs/qcom-next

  test:
    # don't run from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: ./.github/workflows/lava-test.yml
    needs: build
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      url: ${{ needs.build.outputs.artifacts_url }}
      suite: ${{ matrix.suite }}
      # https://github.com/qualcomm-linux/qcom-deb-images/issues/537
      boards_exclude: '["monaco-arduino-monza", "qrb2210-arduino-imola"]'
