# Builds & Tests QLI Debian images:
#  - qcom-next kernel (from QLI APT repo)
#  - Qualcomm overlay repos and packages
#
# This workflow tracks the state of QLI Debian on supported boards.

name: Build

on:
  # run daily at 0:30am. these are the images QLI ships, so they go first of
  # the scheduled builds and get an empty LAVA queue; the rest of the day's
  # builds are staggered behind them (arduino 6:30am, vanilla Debian 10:30am)
  # so that they don't all submit LAVA jobs at once.
  #
  # the images this workflow produces are shared with the test teams and are
  # expected by 8:00am IST (2:30am UTC); building from 0:30am leaves two hours
  # of headroom, see issue #566.
  schedule:
    - cron: '30 0 * * *'
  # allow manual runs
  workflow_dispatch:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    # don't run from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          # the kernel is a matrix option rather than being derived from the
          # profile, so that any kernel can be combined with any profile (e.g.
          # the debug kernel with the default profile when bisecting)
          - suite: trixie
            variant: default
            profile: default
            kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'
          - suite: trixie
            variant: default
            profile: performance
            kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'
          - suite: trixie
            variant: default
            profile: debug
            kernelpackages: 'linux-image-qcom-next-debug,linux-headers-qcom-next-debug'
          - suite: trixie
            variant: weston-multimedia
            profile: default
            kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'
          - suite: trixie
            variant: gnome
            profile: default
            kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'
          - suite: forky
            variant: default
            profile: default
            kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'
    uses: $/.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant }}
      profile: ${{ matrix.profile }}
      kernelpackages: ${{ matrix.kernelpackages }}

  test:
    # only the default profile and variant are tested for now: adding the
    # performance and debug profiles, or the gnome and weston-multimedia
    # variants, to this matrix would multiply the LAVA jobs submitted by
    # this workflow
    #
    # don't run from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: $/.github/workflows/test.yml
    needs: build
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      url: ${{ needs.build.outputs.artifacts_url }}
      suite: ${{ matrix.suite }}
      # the boards tested come from .github/lava-boards.yml
      kernel: qcom-next

  publish-test-results:
    if: always() && needs.test.result != 'skipped'
    needs: test
    uses: $/.github/workflows/publish-results.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
