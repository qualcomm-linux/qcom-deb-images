name: Check LAVA templates

on:
  workflow_call:

# grant nothing by default; every job below declares the scopes it needs. these
# are also capped by the calling job's permissions: block, so callers have to
# grant at least as much.
permissions: {}

jobs:
  schema-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    container: ghcr.io/linux-validation/lava/lava-server-amd64:2026.05-qualcomm-2026.05-22-d5988428c
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Schema check
        run: |
          DEVICE_TYPE="my-device"
          BUILD_FILE_NAME="build.tar.gz"
          BUILD_DOWNLOAD_URL="https://example.com/downloads/1"
          GITHUB_SHA="7e6f96ccf3e911a8a1a18accdbb91991aa0db66e"
          ARTIFACT_PREFIX="trixie-weston-multimedia"

          find ci/lava/ -name "*.yaml" -exec sed \
              -e "s|{{ARTIFACT_PREFIX}}|${ARTIFACT_PREFIX}|g" \
              -e "s|{{BUILD_DOWNLOAD_URL}}|${BUILD_DOWNLOAD_URL}|g" \
              -e "s|{{BUILD_FILE_NAME}}|${BUILD_FILE_NAME}|g" \
              -e "s|{{DEVICE_TYPE}}|${DEVICE_TYPE}|g" \
              -e "s|{{GITHUB_REPOSITORY}}|${GITHUB_REPOSITORY}|g" \
              -e "s|{{GITHUB_RUN_ATTEMPT}}|${GITHUB_RUN_ATTEMPT}|g" \
              -e "s|{{GITHUB_RUN_ID}}|${GITHUB_RUN_ID}|g" \
              -e "s|{{GITHUB_SHA}}|${GITHUB_SHA}|g" \
              -i '{}' \;

          ci/schemacheck.py ci/lava/
