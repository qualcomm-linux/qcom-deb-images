name: Build on push to branch

on:
  push:
    # ci-testing is where the migration to test-distro.yml is being validated.
    # Nothing else runs there: the daily builds and the workflow_run chains are
    # all bound to main, so without this the branch builds and tests nothing.
    # Drop ci-testing from this list once the migration lands on main.
    branches: [main, ci-testing]

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  # TEMPORARY, with the ci-testing trigger above: testing the migration means
  # pushing to the branch over and over, and rebuilding the images every time
  # costs an hour of self-hosted runner for a change that only touches the test
  # half. Pin a build in .github/ci-testing-build-url to reuse it instead.
  build-url:
    name: Resolve the build to test
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    outputs:
      test_matrix: ${{ steps.resolve.outputs.test_matrix }}
      rebuild: ${{ steps.resolve.outputs.rebuild }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the builds to test
        id: resolve
        env:
          PINNED_BUILD_FILE: .github/ci-testing-build-url
          SUITES: '["trixie","forky"]'
        run: |
          set -euo pipefail
          ENTRIES='[]'
          if [ -f "${PINNED_BUILD_FILE}" ]; then
              while read -r KERNEL URL _; do
                  [ -n "${KERNEL}" ] || continue
                  if [ -z "${URL}" ]; then
                      echo "::error::${PINNED_BUILD_FILE}: ${KERNEL} has no URL"
                      exit 1
                  fi
                  case "${URL}" in
                      https://*) ;;
                      *)
                          echo "::error::${PINNED_BUILD_FILE}: ${KERNEL} must name an https:// URL, got '${URL}'"
                          exit 1
                          ;;
                  esac
                  if ! yq -e ".\"${KERNEL}\"" .github/lava-boards.yml >/dev/null 2>&1; then
                      echo "::error::${PINNED_BUILD_FILE}: ${KERNEL} is not a kernel in .github/lava-boards.yml"
                      exit 1
                  fi
                  ENTRIES=$(echo "${ENTRIES}" | jq -c --arg k "${KERNEL}" --arg u "${URL}" '. + [$ARGS.named]')
              done < <(sed 's/#.*//' "${PINNED_BUILD_FILE}")
          fi

          if [ "$(echo "${ENTRIES}" | jq 'length')" -eq 0 ]; then
              # nothing pinned: build qcom-next and test what was just built,
              # which is what this workflow does on main
              echo "no build pinned in ${PINNED_BUILD_FILE}, building the images"
              ENTRIES='[{"k":"qcom-next","u":""}]'
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
              echo "::notice::testing $(echo "${ENTRIES}" | jq -r '[.[].k] | join(", ")') against pinned builds, not rebuilding"
              echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

          # one leg per kernel and suite
          MATRIX=$(echo "${ENTRIES}" | jq -c --argjson suites "${SUITES}" \
              '{include: [.[] as $e | $suites[] as $s | {kernel: $e.k, url: $e.u, suite: $s}]}')
          echo "${MATRIX}" | jq
          echo "test_matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: build-url
    if: needs.build-url.outputs.rebuild == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: ./.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      # QLI targets qcom-next; consume the debs published to EFS by the
      # "qcom-next linux build" workflow rather than a kernel from an
      # APT repository
      kernelpackages: efs/qcom-next
  test:
    # one run per kernel and suite, from the matrix the resolver built
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-url.outputs.test_matrix) }}
    uses: ./.github/workflows/test.yml
    needs: [build-url, build]
    # the build job is skipped when a build is pinned, which "always()" is
    # needed to see; a build that actually failed must still stop the tests
    if: >-
      always() && needs.build-url.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      # the pinned build if there is one, the build we just made otherwise
      url: ${{ matrix.url || needs.build.outputs.artifacts_url }}
      suite: ${{ matrix.suite }}
      # the boards tested come from .github/lava-boards.yml
      kernel: ${{ matrix.kernel }}
