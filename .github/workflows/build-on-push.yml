name: Build on push to branch

on:
  push:
    branches: [wip/obbardc/build-image-profiles]

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

# TODO: move this matrix into build.yml nightly instead
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
          - suite: trixie
            variant: xfcedesktop
          - suite: trixie
            variant: xfcedesktop
            profile: debug
          - suite: trixie
            variant: xfcedesktop
            profile: performance
          - suite: trixie
            variant: multimedia
          - suite: forky

    uses: $/.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant || 'default' }}
      profile: ${{ matrix.profile || 'default' }}
      # QLI targets qcom-next; consume the debs published to EFS by the
      # "qcom-next linux build" workflow rather than a kernel from an
      # APT repository
      kernelpackages: efs/qcom-next

