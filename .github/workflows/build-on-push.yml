name: Build on push to branch

on:
  push:
    branches: [main]

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: ./.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      # QLI targets qcom-next; consume the debs published to EFS by the
      # "qcom-next linux build" workflow rather than a kernel from an
      # APT repository
      kernelpackages: efs/qcom-next
  test:
    uses: ./.github/workflows/lava-test.yml
    needs: build
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      url: ${{ needs.build.outputs.artifacts_url }}
      # id of the run that built the image under test
      build_id: ${{ github.run_id }}
      boards_include: 'glymur-crd,lemans-evk,monaco-evk,qcs615-ride,qcs6490-rb3gen2-vision-kit,qcs8300-ride,qrb2210-rb1,monaco-arduino-monza,qrb2210-arduino-imola'
