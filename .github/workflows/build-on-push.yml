name: Build on push to branch

on:
  push:
    branches: [main, testing, ci-testing]

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: ./.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      # QLI targets qcom-next; consume the debs published to EFS by the
      # "qcom-next linux build" workflow rather than a kernel from an
      # APT repository
      kernelpackages: efs/qcom-next
  schema-check:
    uses: ./.github/workflows/lava-schema-check.yml
    permissions:
      contents: read
  test:
    uses: ./.github/workflows/lava-test.yml
    needs: [build, schema-check]
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      url: ${{ needs.build.outputs.artifacts_url }}
      # identical across the debos matrix legs; see build.yml
      kernel_version: ${{ needs.build.outputs.kernel_version }}
      # recorded in the image from the kernel package's own changelog
      kernel_repo: ${{ needs.build.outputs.kernel_repo }}
      kernel_ref: ${{ needs.build.outputs.kernel_ref }}
      kernel_commit: ${{ needs.build.outputs.kernel_commit }}
      # https://github.com/qualcomm-linux/qcom-deb-images/issues/537
      boards_exclude: '["monaco-arduino-monza", "qrb2210-arduino-imola"]'
