name: Build on push to branch

on:
  push:
    branches: [main]

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: $/.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      # QLI targets qcom-next; consume the debs published to EFS by the
      # "qcom-next linux build" workflow rather than a kernel from an
      # APT repository
      kernelpackages: efs/qcom-next
  test:
    # one test run per suite, matching the images the build job produces;
    # without this only the default suite, trixie, is ever tested
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: $/.github/workflows/test.yml
    needs: build
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      url: ${{ needs.build.outputs.artifacts_url }}
      suite: ${{ matrix.suite }}
      # the boards tested come from .github/lava-boards.yml
      kernel: qcom-next

  publish-test-results:
    if: always() && needs.test.result != 'skipped'
    needs: test
    uses: $/.github/workflows/publish-results.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
