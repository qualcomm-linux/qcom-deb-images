name: Build on push to branch

on:
  push:
    # HACK: temporary, drop before merging: build the installers on pushes
    # to the installer branch
    branches: [main, wip/obbardc/iso-installer]

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    # HACK: temporary, drop before merging: only the installers build on the
    # installer branch; test and publish-test-results skip with this job
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: $/.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      # QLI targets qcom-next; install the kernel from the QLI APT repository
      kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'
  test:
    # one test run per suite, matching the images the build job produces;
    # without this only the default suite, trixie, is ever tested
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: $/.github/workflows/test.yml
    needs: build
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      url: ${{ needs.build.outputs.artifacts_url }}
      suite: ${{ matrix.suite }}
      # the boards tested come from .github/lava-boards.yml
      kernel: qcom-next

  publish-test-results:
    if: always() && needs.test.result != 'skipped'
    needs: test
    uses: $/.github/workflows/publish-results.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      TEST_REPORTING_APP_TOKEN: ${{ secrets.TEST_REPORTING_APP_TOKEN }}

  # HACK: temporary, drop before merging: build the installer ISOs on every
  # push to the installer branch
  installer:
    if: github.ref == 'refs/heads/wip/obbardc/iso-installer'
    strategy:
      fail-fast: false
      matrix:
        kernel: [qcom-7.2, qcom-next, debian]
        suite: [trixie, forky]
        exclude:
          # qcom-7.2 isn't built for forky yet
          - kernel: qcom-7.2
            suite: forky
    uses: $/.github/workflows/installer-build.yml
    permissions:
      contents: read
    with:
      kernel: ${{ matrix.kernel }}
      suite: ${{ matrix.suite }}
