name: Build on push to branch

on:
  push:
    # wip/obbardc/ci-testing is where CI changes are tried before they go to
    # main. Nothing else runs there: the daily builds and the workflow_run
    # chains are all bound to main, so without this the branch builds and tests
    # nothing. Never merge this to main.
    branches: [main, wip/obbardc/ci-testing]

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  # TEMPORARY, with the ci-testing trigger above: trying a CI change means
  # pushing to the branch over and over, and rebuilding the images every time
  # costs an hour of self-hosted runner for a change that only touches the test
  # half. Pin a build in .github/ci-testing-build-url to reuse it instead.
  build-url:
    name: Resolve the build to test
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    outputs:
      test_matrix: ${{ steps.resolve.outputs.test_matrix }}
      rebuild: ${{ steps.resolve.outputs.rebuild }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the builds to test
        id: resolve
        env:
          PINNED_BUILD_FILE: .github/ci-testing-build-url
          SUITES: '["trixie","forky"]'
        run: |
          set -euo pipefail
          ENTRIES='[]'
          if [ -f "${PINNED_BUILD_FILE}" ]; then
              while read -r KERNEL URL PIN_SUITES VARIANT _; do
                  [ -n "${KERNEL}" ] || continue
                  if [ -z "${URL}" ]; then
                      echo "::error::${PINNED_BUILD_FILE}: ${KERNEL} has no URL"
                      exit 1
                  fi
                  case "${URL}" in
                      https://*) ;;
                      *)
                          echo "::error::${PINNED_BUILD_FILE}: ${KERNEL} must name an https:// URL, got '${URL}'"
                          exit 1
                          ;;
                  esac
                  if ! yq -e ".\"${KERNEL}\"" .github/lava-boards.yml >/dev/null 2>&1; then
                      echo "::error::${PINNED_BUILD_FILE}: ${KERNEL} is not a kernel in .github/lava-boards.yml"
                      exit 1
                  fi
                  # the suites the build has images for, every suite unless
                  # the line names some: not every daily workflow builds both
                  ENTRY_SUITES="${SUITES}"
                  if [ -n "${PIN_SUITES}" ]; then
                      ENTRY_SUITES=$(printf '%s' "${PIN_SUITES}" | jq -Rc 'split(",")')
                      if ! echo "${ENTRY_SUITES}" | jq -e --argjson known "${SUITES}" \
                          'length > 0 and all(.[]; IN($known[]))' >/dev/null; then
                          echo "::error::${PINNED_BUILD_FILE}: ${KERNEL} names unknown suites '${PIN_SUITES}', expected some of $(echo "${SUITES}" | jq -r 'join(",")')"
                          exit 1
                      fi
                  fi
                  ENTRIES=$(echo "${ENTRIES}" | jq -c --arg k "${KERNEL}" --arg u "${URL}" \
                      --argjson s "${ENTRY_SUITES}" --arg v "${VARIANT}" '. + [$ARGS.named]')
              done < <(sed 's/#.*//' "${PINNED_BUILD_FILE}")
          fi

          if [ "$(echo "${ENTRIES}" | jq 'length')" -eq 0 ]; then
              # nothing pinned: build qcom-next and test what was just built,
              # which is what this workflow does on main
              echo "no build pinned in ${PINNED_BUILD_FILE}, building the images"
              ENTRIES='[{"k":"qcom-next","u":""}]'
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
              echo "::notice::testing $(echo "${ENTRIES}" | jq -r '[.[].k] | join(", ")') against pinned builds, not rebuilding"
              echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

          # one leg per kernel and suite; an entry with no suites of its own
          # (the unpinned build) gets them all, and no variant is console.
          # build is the <run id>-<attempt> the URL ends in, to name the leg
          # by rather than the whole URL
          MATRIX=$(echo "${ENTRIES}" | jq -c --argjson suites "${SUITES}" \
              '{include: [.[] as $e | ($e.s // $suites)[] as $s |
                  {kernel: $e.k, url: $e.u, suite: $s, variant: ($e.v // ""),
                   build: ($e.u | rtrimstr("/") | split("/") | last // "")}]}')
          echo "${MATRIX}" | jq
          echo "test_matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: build-url
    if: needs.build-url.outputs.rebuild == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: $/.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      # QLI targets qcom-next; install the kernel from the QLI APT repository
      kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'

  sbom-compliance-scan:
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    needs: build
    uses: $/.github/workflows/sbom-compliance-scan.yml
    permissions:
      actions: read
      contents: read

  test:
    # one run per kernel and suite, from the matrix the resolver built. Name it
    # explicitly: the default lists every matrix value, the URL among them
    name: >-
      ${{ matrix.kernel }}, ${{ matrix.suite
      }}${{ matrix.variant && format(', {0}', matrix.variant) || ''
      }}${{ matrix.build && format(', build {0}', matrix.build) || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-url.outputs.test_matrix) }}
    uses: $/.github/workflows/test.yml
    needs: [build-url, build]
    # the build job is skipped when a build is pinned, which "always()" is
    # needed to see; a build that actually failed must still stop the tests
    if: >-
      always() && needs.build-url.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      # the pinned build if there is one, the build we just made otherwise
      url: ${{ matrix.url || needs.build.outputs.artifacts_url }}
      suite: ${{ matrix.suite }}
      # a pin that names no variant is tested on the console images
      variant: ${{ matrix.variant || 'console' }}
      # the boards tested come from .github/lava-boards.yml
      kernel: ${{ matrix.kernel }}

  publish-test-results:
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    needs: test
    uses: $/.github/workflows/publish-results.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      TEST_REPORTING_APP_TOKEN: ${{ secrets.TEST_REPORTING_APP_TOKEN }}
