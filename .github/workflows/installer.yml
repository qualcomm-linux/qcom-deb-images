# Builds the installer images, for both trixie and forky:
#  - live installer for each supported kernel (qcom-7.2, qcom-next, debian and
#    qcom-laptops)
#  - cdrom and netinst installers for the debian and qcom-laptops kernels
#
# The matrix is limited to keep the nightly build time and runner use down; also
# only kernel and suite combinations that exist are built.
#
# See docs/installer.md.

name: Build installers

on:
  schedule:
    - cron: '00 13 * * *'
  # allow manual runs
  workflow_dispatch:
  # HACK: temporary, drop before merging: build the installers on pushes
  # to the installer branch
  push:
    branches: [wip/obbardc/iso-installer]

# grant nothing by default; the job below declares the scopes it needs
permissions: {}

jobs:
  build:
    # don't run from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    # HACK: temporary, drop before merging: also run on pushes to the
    # installer branch
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/wip/obbardc/iso-installer')
    strategy:
      fail-fast: false
      matrix:
        # Base set - build live variant by default.
        kernel: [qcom-7.2, qcom-next, debian, qcom-laptops]
        suite: [trixie, forky]
        installer: [live]

        exclude:
          # Kernel availability varies by suite.
          - {kernel: qcom-7.2, suite: forky}
          - {kernel: qcom-laptops, suite: trixie}

        include:
          # Build cdrom and netinst images for debian and qcom-laptops.
          - {kernel: debian, suite: trixie, installer: cdrom}
          - {kernel: debian, suite: trixie, installer: netinst}
          - {kernel: debian, suite: forky, installer: cdrom}
          - {kernel: debian, suite: forky, installer: netinst}
          - {kernel: qcom-laptops, suite: forky, installer: cdrom}
          - {kernel: qcom-laptops, suite: forky, installer: netinst}
    uses: $/.github/workflows/installer-build.yml
    permissions:
      contents: read
    with:
      kernel: ${{ matrix.kernel }}
      suite: ${{ matrix.suite }}
      installer: ${{ matrix.installer }}
