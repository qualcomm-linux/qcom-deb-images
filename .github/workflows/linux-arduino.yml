name: arduino linux build

on:
  # run daily at 6:30am, once the qcom-next build (2:30am) and the "Build"
  # workflow chained onto it have submitted their LAVA jobs
  schedule:
    - cron: '30 6 * * *'
  # allow manual runs
  workflow_dispatch:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    # don't run cron from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    uses: ./.github/workflows/linux.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    with:
      kernel_name: arduino
      build_linux_deb_extra_args: '--repo https://github.com/qualcomm-linux/kernel-topics --ref early/hwe/arduino'
      # workaround-hexagon-dsp-binaries-monza can be dropped once an
      # updated hexagon-dsp-binaries with Monza support is integrated; see
      # https://github.com/qualcomm-linux/qcom-deb-images/issues/298 and
      # https://github.com/linux-msm/hexagon-dsp-binaries/pull/59
      # workaround-initramfs-firmware-monaco adds firmware to initramfs; see
      # https://github.com/qualcomm-linux/qcom-deb-images/issues/258
      debos_extra_args: '-t overlays:workaround-hexagon-dsp-binaries-monza,workaround-initramfs-firmware-monaco'
      lava_boards_include: '["monaco-arduino-monza", "monaco-evk", "qrb2210-arduino-imola"]'
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
