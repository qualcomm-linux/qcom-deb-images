name: Build on PR

on:
  pull_request:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  event-file:
    name: "Upload event file"
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/upload-artifact
    steps:
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Event File
        path: ${{ github.event_path }}

  build:
    # job name: "build (<suite>, <variant>)"
    name: build (${{ matrix.suite }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
            variant: console
            kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'
          - suite: trixie
            variant: weston-multimedia
            kernelpackages: 'linux-image-qcom-next,linux-image-qcom-next-modules,linux-headers-qcom-next'
          - suite: forky
            variant: console
            kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'
    uses: $/.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant }}
      kernelpackages: ${{ matrix.kernelpackages }}

  sbom-compliance-scan:
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    needs: build
    uses: $/.github/workflows/sbom-compliance-scan.yml
    permissions:
      actions: read
      contents: read
