name: Build on PR

on:
  pull_request:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  event-file:
    name: "Upload event file"
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/upload-artifact
    steps:
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Event File
        path: ${{ github.event_path }}

  build:
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: ./.github/workflows/debos.yml
    permissions:
      contents: read # debos.yml
    with:
      suite: ${{ matrix.suite }}
      # QLI targets qcom-next; consume the debs published to EFS by the
      # "Daily qcom-next linux build" workflow rather than a kernel from an
      # APT repository
      kernelpackages: efs/qcom-next
  schema-check:
    uses: ./.github/workflows/lava-schema-check.yml
    permissions:
      contents: read # lava-schema-check.yml
