name: Build on PR

on:
  pull_request:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  event-file:
    name: "Upload event file"
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/upload-artifact
    steps:
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Event File
        path: ${{ github.event_path }}

  build:
    strategy:
      fail-fast: false
      matrix:
        # QLI targets qcom-next; install the kernel from the QLI APT
        # repository. weston-multimedia also needs the kernel headers to
        # build its out-of-tree drivers with DKMS
        include:
          - suite: trixie
            variant: console
            kernelpackages: 'linux-image-qcom-next'
          - suite: trixie
            variant: weston-multimedia
            kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'
          - suite: forky
            variant: console
            kernelpackages: 'linux-image-qcom-next'
    uses: $/.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant }}
      kernelpackages: ${{ matrix.kernelpackages }}
