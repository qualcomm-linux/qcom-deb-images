name: Build on PR

on:
  pull_request:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  event-file:
    name: "Upload event file"
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/upload-artifact
    steps:
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Event File
        path: ${{ github.event_path }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
            variant: console
          - suite: trixie
            variant: weston-multimedia
          - suite: forky
            variant: console
    uses: $/.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant }}
      # QLI targets qcom-next; install the kernel from the QLI APT repository
      kernelpackages: 'linux-image-qcom-next,linux-headers-qcom-next'

  installer:
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: $/.github/workflows/installer.yml
    needs: build
    permissions:
      contents: read
    with:
      url: ${{ needs.build.outputs.artifacts_url }}
      suite: ${{ matrix.suite }}
