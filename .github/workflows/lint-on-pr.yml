name: Lint on PR

on:
  # run on pull requests to the main branch; also run when the pull request
  # title is edited as it is checked below
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

# implicitly set all other permissions to none
permissions:
  contents: read # actions/checkout

# cancel in progress checks for this workflow triggered by the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Check the pull request title and commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # the title is passed through the environment instead of being expanded
      # into the script to avoid it being interpreted as shell code
      - name: Check the title and commit messages against CONTRIBUTING.md
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # the task types documented in CONTRIBUTING.md
          types="feat fix refactor docs ci test chore"

          # <type>[(<scope>)][!]: <description>, with the scope limited to
          # the path-like scopes used in the history
          subject_re="^(${types// /|})(\([a-zA-Z0-9._/-]+\))?!?: .+"

          # CONTRIBUTING.md asks to keep the subject line and every body
          # line at 72 characters or less
          max_length=72

          # check the subject passed as second parameter, the first one
          # labels where it comes from; the case of the description is not
          # enforced as some subjects are generated by tools, e.g. Dependabot
          check_subject() {
              local label="$1" subject="$2" errors=""

              if ! grep -qE "$subject_re" <<< "$subject"; then
                  errors+="
                  it is not in the form <type>[(<scope>)][!]: <description>,
                  where <type> is one of: $types"
              fi

              if [ "${#subject}" -gt "$max_length" ]; then
                  errors+="
                  it is ${#subject} characters long, keep it to $max_length"
              fi

              case "$subject" in
              *.)
                  errors+="
                  it ends with a full stop"
                  ;;
              esac

              if [ -n "$errors" ]; then
                  printf 'FAILED  %-8s  %s%s\n' "$label" "$subject" "$errors"
                  return 1
              fi

              printf 'ok      %-8s  %s\n' "$label" "$subject"
          }

          # check the body passed as second parameter, the first one labels
          # which commit it comes from; lines holding a URL are accepted as
          # they cannot be wrapped
          check_body() {
              local label="$1" body="$2" line="" number=1 rc=0

              while IFS= read -r line; do
                  number=$((number + 1))

                  if [ "${#line}" -gt "$max_length" ] &&
                     [[ "$line" != *://* ]]; then
                      printf 'FAILED  %-8s  line %d is %d characters long,' \
                             "$label" "$number" "${#line}"
                      printf ' keep it to %d\n' "$max_length"
                      printf '                  %s\n' "$line"
                      rc=1
                  fi
              done <<< "$body"

              return "$rc"
          }

          status=0

          check_subject title "$PR_TITLE" || status=1

          # merge commits are skipped as their message is generated by git
          # and by the GitHub merge queue; the commits are collected first so
          # that a git failure fails the job instead of being read as an
          # empty list
          commits="$(git rev-list --no-merges --reverse \
                         "$BASE_SHA".."$HEAD_SHA")"

          if [ -n "$commits" ]; then
              while IFS= read -r sha; do
                  message="$(git log -1 --format=%B "$sha")"

                  check_subject "${sha:0:8}" "$(head -n1 <<< "$message")" ||
                      status=1
                  check_body "${sha:0:8}" "$(tail -n +2 <<< "$message")" ||
                      status=1
              done <<< "$commits"
          fi

          if [ "$status" -ne 0 ]; then
              echo
              echo "Some commit messages do not follow the commit" \
                   "specifications; see the 'Commit messages' section" \
                   "of CONTRIBUTING.md. Reword the pull request title and/or" \
                   "the commits above with git rebase -i $BASE_SHA."
              exit 1
          fi
