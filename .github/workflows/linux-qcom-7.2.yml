name: qcom-7.2 linux build

on:
# run daily at 4:30am, after qcom-next (0:30am).
  schedule:
    - cron: '30 4 * * *'
  # allow manual runs
  workflow_dispatch:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    # don't run cron from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    uses: $/.github/workflows/linux.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    with:
      kernel_name: qcom-7.2
      build_linux_deb_extra_args: '--repo https://github.com/qualcomm-linux/kernel --ref qcom-7.2-20260915 prune.config qcom.config'
      suites: '["trixie"]'
      lava_boards_include: '["glymur-crd"]'
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
