name: mainline linux build

on:
  schedule:
    - cron: '00 9 * * 1'
  # allow manual runs
  workflow_dispatch:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    # don't run cron from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    uses: $/.github/workflows/linux.yml
    permissions:
      actions: read
      checks: write
      contents: read
      packages: read
      pull-requests: write
    with:
      kernel_name: mainline
      # the boards tested come from .github/lava-boards.yml, under mainline
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
      TEST_REPORTING_APP_TOKEN: ${{ secrets.TEST_REPORTING_APP_TOKEN }}
