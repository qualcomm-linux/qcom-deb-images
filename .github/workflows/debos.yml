name: Build debos recipe

on:
  workflow_call:
    inputs:
      suite:
        description: Distribution suite (e.g. trixie, forky)
        type: string
        default: trixie
      overlays:
        description: >
          Comma-separated list of rootfs overlays to apply from
          debos-recipes/overlays/ (e.g. workaround-name); "none" or unset
          applies no overlay.
        type: string
        default: 'none'
      kernelpackages:
        description: >
          Comma-separated list of kernel packages to install from APT
          repositories (e.g. linux-image-arm64) or name of a EFS kernel
          package directory (e.g. efs/mainline)
        type: string
        default: linux-image-arm64
      debos_extra_args:
        description: Extra arguments to pass to debos (e.g. -t dtb:qcom/some.dtb)
        type: string
        default: ''
      variant:
        description: >
          Name of the image variant to build (e.g. multimedia); it selects the
          debos arguments listed in the "Select debos arguments for the image
          variant" step of the debos-build action and is appended to the name of every published
          artifact, so that variants of the same suite don't overwrite each
          other. Empty or "default" builds the default image.
        type: string
        default: ''
      # useful if for some reason the kernel/image can't start in QEMU
      skip_qemu_tests:
        description: Skip QEMU tests
        type: boolean
        default: false

    outputs:
      artifacts_url:
        description: "URL to retrieve build artifacts"
        value: ${{ jobs.build-debos.outputs.url }}

# grant nothing by default; every job below declares the scopes it needs. these
# are also capped by the calling job's permissions: block, so callers have to
# grant at least as much.
permissions: {}

env:
  # image build id; used for SBOM generation
  BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  KERNEL_PACKAGES: ${{ inputs.kernelpackages }}
  DEBOS_EXTRA_ARGS: -t suite:${{ inputs.suite }} ${{ inputs.debos_extra_args }}
  # e.g. "trixie" for the default image, "trixie-multimedia" for a variant
  PREFIX: ${{ (inputs.variant && inputs.variant != 'default') && format('{0}-{1}', inputs.suite, inputs.variant) || inputs.suite }}

jobs:
  build-debos:
    name: Build and upload debos recipes (${{ inputs.variant && format('{0}, {1}', inputs.suite, inputs.variant) || inputs.suite }})
    permissions:
      contents: read # actions/checkout
    outputs:
      url: ${{ steps.upload_artifacts_s3.outputs.url }}
    runs-on: [self-hosted, qcom-u2404, arm64]
    container:
      image: public.ecr.aws/debian/debian:trixie
      volumes:
        - /efs/qli/qcom-deb-images:/efs
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Copy U-Boot for RB1 from EFS
        run: cp -av "/efs/u-boot-rb1-latest/rb1-boot.img" .

      - name: Build rootfs and disk images
        id: build
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: $/.github/actions/debos-build
        with:
          architecture: arm64
          suite: ${{ inputs.suite }}
          variant: ${{ inputs.variant }}
          overlays: ${{ inputs.overlays }}
          kernelpackages: ${{ inputs.kernelpackages }}
          debos_extra_args: ${{ inputs.debos_extra_args }}

      - name: Copy unstripped vmlinux from EFS
        run: |
          set -ux
          # the kernel workflow publishes the unstripped vmlinux next to the
          # debs; pick it up so it gets published with the image artifacts.
          case "$KERNEL_PACKAGES" in
            efs/*)
              efs_kernel_dir="/efs/${KERNEL_PACKAGES#efs/}"
              # kernel builds predating the vmlinux artifact have none
              if [ -f "${efs_kernel_dir}/vmlinux" ]; then
                  cp -av "${efs_kernel_dir}/vmlinux" .
              fi
            ;;
          esac

      - name: Build flashable files with debos
        env:
          DEBOS_VARIANT_ARGS: ${{ steps.build.outputs.variant_args }}
        run: |
          set -ux
          make flash FAKEMACHINE_OPTS="-b qemu" EXTRA_DEBOS_OPTS="-t u_boot_rb1:rb1-boot.img -t buildid:${BUILD_ID} --print-recipe ${DEBOS_EXTRA_ARGS} ${DEBOS_VARIANT_ARGS}"

      - name: Stage debos artifacts for publishing
        run: |
          set -ux
          # create a directory for the current run
          dir="debos-artifacts"
          mkdir -v "${dir}"
          # compress output files directly into the staging directory; the
          # published arm64 artifacts keep the names they had before the build
          # artifacts gained an architecture suffix
          gzip -c rootfs-arm64.tar >"${dir}/${PREFIX}-rootfs.tar.gz"
          gzip -c disk-ufs-arm64.img >"${dir}/${PREFIX}-disk-ufs.img.gz"
          gzip -c disk-sdcard-arm64.img >"${dir}/${PREFIX}-disk-sdcard.img.gz"
          cp -av dtbs-arm64.tar.gz "${dir}/${PREFIX}-dtbs.tar.gz"
          # publish the unstripped vmlinux of the kernel installed in the image
          # to facilitate debugging oops/panic backtraces; absent when the kernel
          # comes from APT rather than from an EFS kernel build.
          if [ -f vmlinux ]; then
              gzip -c vmlinux >"${dir}/${PREFIX}-vmlinux.gz"
          fi
          # create tarballs with support for all UFS and all eMMC boards
          scripts/bundle-flash-dirs.sh "${dir}" "${PREFIX}"
          # generate sha256sums for all artifacts
          (cd "${dir}" && sha256sum * | tee "${PREFIX}-sha256sums.txt")

      # upload to a cloud storage space accessible by Axiom
      - name: Upload private artifacts (S3)
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        id: upload_artifacts_s3
        with:
          path: debos-artifacts
          # these should be the defaults; or ought to reuse BUILD_ID
          s3_bucket: qcom-prd-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/

      - name: Unpack rootfs to generate SBOM
        run: mkdir -v rootfs && tar -C rootfs -xf rootfs-arm64.tar

      # Use the "download-syft" sub-action to install Syft and keep it
      # updated via Dependabot.
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate SBOMs with Syft
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -ux
          "$SYFT" --version
          SYFT_FORMAT_PRETTY=true "$SYFT" \
              -o cyclonedx-json=rootfs-sbom.cyclonedx.json \
              -o spdx-json=rootfs-sbom.spdx.json \
              -o syft-json=rootfs-sbom.syft.json \
              -o syft-text=rootfs-sbom.syft.txt \
              -o syft-table \
              --parallelism `nproc` \
              --select-catalogers debian \
              --source-name qualcomm-linux-debian-rootfs \
              --source-version "${BUILD_ID}" \
              -v \
              scan rootfs

      - name: Generate license summary from Syft report
        run: |
          set -ux
          scripts/syft-license-summary.py \
              --rootfs rootfs rootfs-sbom.syft.json |
                  tee rootfs-sbom.syft-license-summary.csv.txt

      # Use the "download-grype" sub-action to install Grype and keep it
      # updated via Dependabot.
      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      # the vulnerability database is downloaded separately from the scan so
      # that a transient download failure is reported as its own step, and so
      # the database metadata (built date, schema) shows up in the logs; it also
      # lists the data providers, which is where the Debian Security Tracker
      # data comes from (provider "debian")
      - name: Update Grype vulnerability database
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          set -ux
          "$GRYPE" --version
          "$GRYPE" db update -v
          "$GRYPE" db status
          "$GRYPE" db providers

      # scan the SBOM generated above by Syft rather than the rootfs directory:
      # it's much faster and it guarantees both reports describe exactly the
      # same set of packages
      #
      # the distro is not overridden with --distro: the SBOM already records the
      # Debian release from the rootfs' os-release, and that is what Grype needs
      # to select the Debian provider's data. passing a codename Grype doesn't
      # map to a release (e.g. forky while it's still testing) would silently
      # match nothing at all
      #
      # --by-cve reports CVE identifiers instead of Debian-specific DSA/DLA ids,
      # which is what downstream tooling and reports expect
      #
      # no --fail-on: a Debian image always carries known unfixed CVEs, so
      # failing the build on severity would make every build red; the reports
      # are published as artifacts for review instead
      - name: Scan SBOM for vulnerabilities with Grype
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          set -ux
          "$GRYPE" \
              -o json=rootfs-vulns.grype.json \
              -o table=rootfs-vulns.grype.txt \
              -o cyclonedx-json=rootfs-vulns.grype.cyclonedx.json \
              -o sarif=rootfs-vulns.grype.sarif \
              --by-cve \
              --sort-by severity \
              -v \
              sbom:rootfs-sbom.syft.json
          # every -o above writes to a file, so echo the table to the log too
          cat rootfs-vulns.grype.txt

      - name: Stage SBOMs and Vulnerability report for publishing
        run: |
          set -ux
          dir="sboms"
          mkdir -v sboms
          for f in rootfs-sbom.* rootfs-vulns.*; do
              gzip -c "$f" >"${dir}/${PREFIX}-${f}.gz"
          done

      - name: Upload SBOMs as private artifacts
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        id: upload_sbom_artifacts
        with:
          path: sboms
          # these should be the defaults; or ought to reuse BUILD_ID
          s3_bucket: qcom-prd-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/

      - name: "Print output"
        env:
          build_url: ${{ steps.upload_artifacts_s3.outputs.url }}
        run: |
          echo "Downloads URL: ${build_url}"
          echo "url=\"${build_url}\"" >> $GITHUB_OUTPUT
          echo "${build_url}" > build_url
          echo "## Download URL" >> $GITHUB_STEP_SUMMARY
          echo "[${build_url}](${build_url})" >> $GITHUB_STEP_SUMMARY
          # append the Grype summary after the download link, so the link stays
          # at the top of the job summary
          scripts/grype-vulnerability-summary.py rootfs-vulns.grype.json \
              --sbom rootfs-sbom.syft.json \
              >> $GITHUB_STEP_SUMMARY
      - name: Upload build URL
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build_url
          path: build_url
      - name: Invoke test runner
        if: ${{ !inputs.skip_qemu_tests }}
        run: |
           # This is currently a clone of Makefile's "test" target to avoid any
           # unexpected interactions with triggering depending build targets.
           # The plan is to move this entire workflow to use make targets
           # instead but all at once. See #74 and #159.

           # rootfs/ is a build artifact, so should not be scanned for tests
           # --verbose enables verbose output which shows each test's full name
           #   and full result which makes CI failures much easier to diagnose
           # --capture=no so pytest doesn't swallow stdout and only prints it
           #   after a job fails. Instead, stream the log live.
           py.test-3 --verbose --capture=no --ignore=rootfs
