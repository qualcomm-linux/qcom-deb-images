name: Qualcomm Preflight Checks
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  preflight:
    name: Run QC Preflight Checks
    permissions:
      contents: read
      security-events: write
    # deliberately tracks the moving v2 tag rather than a commit SHA like
    # every other action: we own qcom-reusable-workflows and want its
    # fixes picked up straight away without waiting for Dependabot
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@v2
    with:
      enable-semgrep-scan: true
      enable-dependency-review: true
      enable-repolinter-check: true
      enable-copyright-license-check: true
      enable-commit-email-check: true
      enable-commit-msg-check: true
      enable-armor-checkers: false
