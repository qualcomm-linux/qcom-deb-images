name: Qualcomm Preflight Checks
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  preflight:
    name: Run QC Preflight Checks
    permissions:
      contents: read # reusable-qcom-preflight-checks-orchestrator.yml
      security-events: write # reusable-qcom-preflight-checks-orchestrator.yml
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@15377d14305caeaeacbda9b24f93f57258e55b37 # v2.0.8
    with:
      enable-semgrep-scan: true
      enable-dependency-review: true
      enable-repolinter-check: true
      enable-copyright-license-check: true
      enable-commit-email-check: true
      enable-commit-msg-check: false
      # armor-checkers verifies source-level (API) and binary-level (ABI)
      # backwards compatibility of source code. This repository contains
      # image recipes and scripts rather than a library with a stable
      # API/ABI.
      enable-armor-checkers: false
