name: qcom-next linux build

on:
  # run daily at 4:30am, after the "Build" workflow started at 0:30am has
  # submitted its LAVA jobs, so that this build doesn't add its own on top of
  # theirs; the rest of the day's builds are staggered behind it in turn
  # (arduino 6:30am, linux-next 8:30am, vanilla Debian images 10:30am)
  schedule:
    - cron: '30 4 * * *'
  # allow manual runs
  workflow_dispatch:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build:
    # don't run cron from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    uses: ./.github/workflows/linux.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    with:
      kernel_name: qcom-next
      build_linux_deb_extra_args: '--qcom-next prune.config qcom.config'
      # stop after publishing the debs to EFS; the "Build" workflow
      # picks them up and builds and tests the images on every suite
      skip_image_build: true
      # https://github.com/qualcomm-linux/qcom-deb-images/issues/537
      lava_boards_exclude: '["monaco-arduino-monza", "qrb2210-arduino-imola"]'
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
