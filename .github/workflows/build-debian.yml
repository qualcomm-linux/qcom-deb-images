# Builds & Tests Vanilla Debian images:
#  - kernel installed from the Debian archive
#  - no Qualcomm overlay repos or packages
#
# This workflow tracks the state of upstream Debian on supported boards.

name: Build Debian

on:
  # run daily at 10:30am, last of the daily builds: this tracks upstream Debian
  # rather than what QLI ships, so it gets the LAVA queue once the kernel builds
  # are done with it
  schedule:
    - cron: '30 10 * * *'
  # allow manual runs
  workflow_dispatch:

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  build-debian:
    # don't run cron from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: ./.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      suite: ${{ matrix.suite }}
      # plain Debian kernel: the Debian kernel and none of the Qualcomm overlays
      # so that we simply test the state of upstream Debian
      overlays: none
      kernelpackages: linux-image-arm64
      # ... and none of the Qualcomm APT sources either, so that the upgrade
      # which follows the bootstrap only ever pulls in packages from Debian
      debos_extra_args: -t qliaptrepo:false

  test-debian:
    # don't run cron from forks of the main repository or from other branches;
    # manual runs are allowed from any branch of the main repository so
    # that changes to the workflows can be tested before they are merged
    if: >-
      github.repository == 'qualcomm-linux/qcom-deb-images' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky]
    uses: ./.github/workflows/lava-test.yml
    needs: build-debian
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      url: ${{ needs.build-debian.outputs.artifacts_url }}
      suite: ${{ matrix.suite }}
      # boards below were last manually checked on 2026-09-04 by boot testing
      # the trixie and forky images from build 33744987559-1 with linux debs
      # 7.1.8-1~bpo13+1 and 7.1.12-1; both suites have the same gaps:
      # - glymur-crd flashes fine but no linux output
      # - qrb2210-rb1 starts linux but it stops in initramfs on trixie and
      #   goes in a boot loop on forky; see #424
      # - qrb2210-arduino-imola probably starts linux on trixie, but doesn't
      #   reach console output, and goes in a boot loop on forky
      # - monaco-arduino-monza, monaco-evk and qcs8300-ride do boot the
      #   distro kernel, but wlan-smoke fails on them (no WLAN interface, or
      #   it never comes up), so they stay out until WLAN works; see #440
      boards_exclude: '["glymur-crd", "monaco-arduino-monza", "monaco-evk", "qcs8300-ride", "qrb2210-arduino-imola", "qrb2210-rb1"]'
      # failures here are about upstream Debian, not about qcom-deb-images;
      # they are reported through this workflow instead of gating our work
      report_test_results_externally: false
