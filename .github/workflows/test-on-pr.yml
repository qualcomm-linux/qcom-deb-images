name: Test PR build

run-name: "Tests triggered by PR: ${{ github.event.workflow_run.display_title }}"

# workflow_run is required to comment on PRs from forks: pull_request runs
# from a fork get a read-only token and cannot post a comment. This workflow
# never checks out or executes PR-controlled code, it only reads artifacts and
# the event payload, so the usual workflow_run privilege-escalation route does
# not apply.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Build on PR"]
    types:
      - completed

# grant nothing by default; every job below declares the scopes it needs, so
# retrieve-build-url stays read-only
permissions: {}

jobs:
  retrieve-build-url:
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/github-script
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      url: ${{ steps.set-build-url.outputs.url }}
    steps:
      - name: 'Download build URL'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "build_url"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            const fs = require('fs');
            const path = require('path');
            const temp = '${{ runner.temp }}/artifacts';
            if (!fs.existsSync(temp)){
              fs.mkdirSync(temp);
            }
            fs.writeFileSync(path.join(temp, 'build_url.zip'), Buffer.from(download.data));

      - name: 'Setup build URL'
        id: set-build-url
        run: |
          unzip "${{ runner.temp }}/artifacts/build_url.zip"
          BUILD_URL=$(cat build_url)
          echo "Build URL: ${BUILD_URL}"
          echo "url=${BUILD_URL}" >> $GITHUB_OUTPUT

  test:
    # name the job after the image it boots; this is also what prefixes the
    # nested job names in the UI
    name: Test ${{ matrix.artifact_prefix || matrix.suite }}
    uses: ./.github/workflows/lava-test.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    needs: retrieve-build-url
    strategy:
      fail-fast: false
      # One entry per image "Build on PR" builds, so that nothing is built on
      # a pull request without being booted. Each entry is a full LAVA sweep
      # across every board, which is what an image costs to validate; a
      # variant that is built and never booted buys nothing at all, and a pull
      # request is where a regression is cheapest to catch. Keep this list in
      # step with the build matrix in build-on-pr.yml. artifact_prefix is
      # omitted for a suite's default image, whose prefix is just the suite.
      matrix:
        include:
          - suite: trixie
          - suite: forky
          # boot the Weston/multimedia session rather than the Xfce desktop
          - suite: trixie
            artifact_prefix: trixie-weston-multimedia
          - suite: forky
            artifact_prefix: forky-weston-multimedia
    with:
      # every leg of the build uploads to the same directory and so reports
      # the same URL, which is why picking one of the duplicate build_url
      # artifacts above is safe; see #397. Which image is booted out of that
      # directory is decided by artifact_prefix below, not by this URL.
      url: ${{ needs.retrieve-build-url.outputs.url }}
      # this is what artifact_prefix falls back to for a default image, so it
      # is spelled out rather than left to lava-test.yml's own default
      suite: ${{ matrix.suite }}
      artifact_prefix: ${{ matrix.artifact_prefix }}
      # https://github.com/qualcomm-linux/qcom-deb-images/issues/537
      boards_exclude: '["monaco-arduino-monza", "qrb2210-arduino-imola"]'

  publish-test-results:
    name: "Publish Tests Results"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      checks: write # EnricoMi/publish-unit-test-result-action
      contents: read # EnricoMi/publish-unit-test-result-action
      packages: read # actions/download-artifact
      # EnricoMi/publish-unit-test-result-action
      # thollander/actions-comment-pull-request
      pull-requests: write
    steps:
      # One report covers every image the test job booted, so these collect
      # all of them rather than naming a prefix: that keeps the list of images
      # in the test job's matrix alone, with nothing here to keep in sync.
      #
      # Results are named "test-results-<board>-<image>" and the action
      # deletes the previous same-named artifact before uploading, so only the
      # latest per board and image ever exists and this cannot pick up a stale
      # one. Job details keep the LAVA job id in their name and are never
      # replaced, so they still have to be scoped to this run attempt.
      - name: Download test results (latest per board, all images)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: test-results-*

      - name: Download job details (this run attempt, all images)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: '*-${{ github.run_attempt }}-test-job-*'

      - name: Download event file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
            run-id: ${{ github.event.workflow_run.id }}
            path: artifacts
            github-token: ${{ github.token }}

      - name: "List files"
        run: |
          echo $GITHUB_WORKSPACE
          ls -R $GITHUB_WORKSPACE

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "${{ github.workspace }}/artifacts/**/*.xml"

      - name: Prepare PR comment
        id: pr_comment_prep
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "## Test jobs for commit ${HEAD_SHA}" > pr-comment.txt
          # sorted so that the jobs of one image stay together in the comment
          for json_file in $(find ${{ github.workspace }} -name "*test-job-*.json" | sort)
          do
              DEVICE_TYPE=$(cat "$json_file" | jq -r ".requested_device_type")
              URL=$(cat "$json_file" | jq -r ".url")
              JOB_ID=$(cat "$json_file" | jq -r ".id")
              # more than one image is booted, so say which one this job ran.
              # lava-action names the file "<image>-<run attempt>-test-job-<job
              # id>.json", after the test_job_file_name_prefix lava-test.yml
              # gives it, so the image is recoverable from the name
              IMAGE=$(basename "$json_file" .json)
              IMAGE="${IMAGE%%-${GITHUB_RUN_ATTEMPT}-test-job-*}"
              echo " * \`$IMAGE\`: [Job $JOB_ID on $DEVICE_TYPE]($URL)"
              echo " * \`$IMAGE\`: [Job $JOB_ID on $DEVICE_TYPE]($URL)" >> pr-comment.txt
          done
          PR_NUMBER=$(cat "artifacts/Event File/event.json" | jq -r ".number")
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          file-path: pr-comment.txt
          pr-number: ${{ steps.pr_comment_prep.outputs.pr_number }}
