name: Test PR build

run-name: "Tests triggered by PR: ${{ github.event.workflow_run.display_title }}"

# workflow_run is required to comment on PRs from forks: pull_request runs
# from a fork get a read-only token and cannot post a comment. This workflow
# never checks out or executes PR-controlled code, it only reads artifacts and
# the event payload, so the usual workflow_run privilege-escalation route does
# not apply.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Build on PR"]
    types:
      - completed

concurrency:
  group: test-pr-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# grant nothing by default; every job below declares the scopes it needs, so
# retrieve-build-url stays read-only
permissions: {}

jobs:
  retrieve-build-url:
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/github-script
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      url: ${{ steps.set-build-url.outputs.url }}
      pr_number: ${{ steps.pr-details.outputs.pr_number }}
      pr_url: ${{ steps.pr-details.outputs.pr_url }}
    steps:
      - name: 'Download build URL'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "build_url"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            const fs = require('fs');
            const path = require('path');
            const temp = '${{ runner.temp }}/artifacts';
            if (!fs.existsSync(temp)){
              fs.mkdirSync(temp);
            }
            fs.writeFileSync(path.join(temp, 'build_url.zip'), Buffer.from(download.data));

      - name: 'Setup build URL'
        id: set-build-url
        run: |
          unzip "${{ runner.temp }}/artifacts/build_url.zip"
          BUILD_URL=$(cat build_url)
          echo "Build URL: ${BUILD_URL}"
          echo "url=${BUILD_URL}" >> $GITHUB_OUTPUT

      - name: Download event file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Event File
          path: event-file
          github-token: ${{ github.token }}

      - name: 'Read pull request details'
        id: pr-details
        # github.event.workflow_run.pull_requests is empty for a fork, so the
        # number and the URL are read out of the event the build recorded
        run: |
          set -euo pipefail
          PR_NUMBER=$(jq -r '.number // ""' event-file/event.json)
          PR_URL=$(jq -r '.pull_request.html_url // ""' event-file/event.json)
          echo "pull request #${PR_NUMBER}: ${PR_URL}"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    needs: retrieve-build-url
    with:
      url: ${{ needs.retrieve-build-url.outputs.url }}
      # the run that built the image under test is the triggering "Build on PR"
      # run, not this one; it is also where the event file lives
      build_id: ${{ github.event.workflow_run.id }}
      kernel: qcom-next
      suite: trixie
      pr_number: ${{ needs.retrieve-build-url.outputs.pr_number }}
      pr_url: ${{ needs.retrieve-build-url.outputs.pr_url }}
      # this run is on the base branch, the results belong to the pull request
      commit: ${{ github.event.workflow_run.head_sha }}
      head_repository: ${{ github.event.workflow_run.head_repository.full_name }}

  comment-on-pr:
    name: "Comment on PR"
    needs: [retrieve-build-url, test]
    if: always() && needs.test.outputs.summary_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # thollander/actions-comment-pull-request
      pull-requests: write
    steps:
      - name: Download summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.test.outputs.summary_id }}
          path: summary

      - name: Prepare PR comment
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "## Test results for commit ${HEAD_SHA}" > pr-comment.txt
          echo "" >> pr-comment.txt
          find summary -type f -exec cat {} + >> pr-comment.txt
          cat pr-comment.txt

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          file-path: pr-comment.txt
          pr-number: ${{ needs.retrieve-build-url.outputs.pr_number }}
          # update the same comment instead of appending one per re-run
          comment-tag: test-results

  publish-test-results:
    if: always() && needs.test.result != 'skipped'
    needs: test
    uses: ./.github/workflows/publish-results.yml
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    with:
      commit: ${{ github.event.workflow_run.head_sha }}
      event_name: ${{ github.event.workflow_run.event }}
      build_id: ${{ github.event.workflow_run.id }}
