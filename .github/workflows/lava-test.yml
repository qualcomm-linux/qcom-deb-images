name: Tests

on:
  workflow_call:
    inputs:
      url:
        required: true
        type: string
      build_id:
        required: true
        type: string
      suite:
        description: Distribution suite (e.g. trixie, forky)
        type: string
        default: trixie
      boards_include:
        description: >
          Comma separated list of board names to include (empty = no boards);
          forwarded to test-distro.yml as its devices input
        type: string
        default: ''
      report_test_results_externally:
        description: >
          Report results outside this workflow run: as a check run attached to
          the commit and as a comment on any associated pull request. Set to
          false for builds whose failures say something about the code under
          test rather than about qcom-deb-images; results then stay in the job
          summary, which is written either way.

          TODO: reporting now happens in meta-qcom's test-distro.yml, which
          does not take an equivalent input yet, so this is currently declared
          but not wired up. Callers keep passing it so the behaviour can be
          restored without touching them again.
        type: boolean
        default: true
    outputs:
      summary_ids:
        description: "IDs of the test summary artifact"
        value: ${{ jobs.collect-ids.outputs.summary_ids }}
    # this is the only workflow that consumes a secret; like permissions:, it
    # has to be named again by every caller down the chain
    secrets:
      LAVATOKEN:
        description: API token used to submit jobs to LAVA
        required: true

# grant nothing by default; every job below declares the scopes it needs. these
# are also capped by the calling job's permissions: block, so callers have to
# grant at least as much.
permissions: {}

env:
  # git sha, tag or branch in lava-test-plans repository
  LAVA_TEST_PLANS_REF: "b9de72b563d8b361b39075c6070d76010040660e"

jobs:
  prepare-env:
    name: Prepare environment
    runs-on: ubuntu-latest
    steps:
      - name: "Print lava-test-plans ref"
        shell: bash
        run: |
          echo "lava-test-plans ref: ${{ env.LAVA_TEST_PLANS_REF }}"
    outputs:
      lava-test-plans-ref: "${{ env.LAVA_TEST_PLANS_REF }}"

  test-debian:
    needs: prepare-env
    name: Test debian
    uses: mwasilew/meta-qcom/.github/workflows/test-distro.yml@debian-support
    secrets: inherit
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "${{ inputs.boards_include }}"
      project_name: "qcom-deb-images"
      distro_name: "debian"
      lava_test_plans_ref: "${{ needs.prepare-env.outputs.lava-test-plans-ref }}"

  collect-ids:
    name: "Collect Summary artifact IDs"
    needs: [test-debian]
    if: |
      always()
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    outputs:
      summary_ids: ${{ steps.generate-summary.outputs.artifact_ids }}
    steps:
      - name: Summary IDs
        id: generate-summary
        # the id is passed through the environment rather than interpolated
        # into the script, so its contents can never be run as shell code
        env:
          SUMMARY_ID: "${{ needs.test-debian.outputs.summary_id }}"
        run: |
          printf 'artifact_ids=%s\n' "${SUMMARY_ID}" >> "$GITHUB_OUTPUT"
