name: Tests

on:
  workflow_call:
    inputs:
      url:
        required: true
        type: string
      suite:
        description: Distribution suite (e.g. trixie, forky)
        type: string
        default: trixie
      boards_include:
        description: JSON array of board names to include (empty = all boards)
        type: string
        default: ''
      boards_exclude:
        description: JSON array of board names to exclude (empty = none excluded)
        type: string
        default: ''
    # this is the only workflow that consumes a secret; like permissions:, it
    # has to be named again by every caller down the chain
    secrets:
      LAVATOKEN:
        description: API token used to submit jobs to LAVA
        required: true

# grant nothing by default; every job below declares the scopes it needs. these
# are also capped by the calling job's permissions: block, so callers have to
# grant at least as much.
permissions: {}

env:
  BUILD_URL: ${{ inputs.url }}
  LAVA_CI: ci/lava/
  SUITE: ${{ inputs.suite }}
  BOARDS_INCLUDE: ${{ inputs.boards_include }}
  BOARDS_EXCLUDE: ${{ inputs.boards_exclude }}

jobs:
  prepare-job-list:
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    outputs:
      jobmatrix: ${{ steps.listjobs.outputs.jobmatrix }}
      has_jobs: ${{ steps.listjobs.outputs.has_jobs }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Print trigger
        run: |
          echo "Triggered by ${{ github.event_name }}"
          echo "Build URL: $BUILD_URL"
      - name: "List jobs"
        id: listjobs
        run: |
          # json with display names and relative filenames to LAVA templates
          J=$(find "${LAVA_CI}" -name '*.yaml' -print0 |
                  jq --compact-output --raw-input --slurp \
                      --argjson include "${BOARDS_INCLUDE:-[]}" \
                      --argjson exclude "${BOARDS_EXCLUDE:-[]}" '
                      # split null-delimited list and remove last empty item
                      split("\u0000")[:-1]
                      # remove leading "ci/lava/"
                      | map(sub("^ci/lava/"; ""))
                      # build include entries with board name (for filtering), target and pretty name
                      | map({
                          board: split("/")[0],
                          target: .,
                          # filename-safe id per target, e.g. qrb2210-rb1-boot
                          slug: (
                              .
                              | sub("\\.yaml$"; "")
                              | gsub("/"; "-")
                          ),
                          name: (
                              .
                              | sub("\\.yaml$"; "")
                              | gsub("/"; " ")
                          )
                        })
                      # restrict to boards listed in $include (if non-empty)
                      | if ($include | length) > 0 then
                          map(select(.board as $b | $include | any(. == $b)))
                        else . end
                      # remove boards listed in $exclude (if non-empty)
                      | if ($exclude | length) > 0 then
                          map(select(.board as $b | $exclude | any(. == $b) | not))
                        else . end
                      # drop temporary board field
                      | map(del(.board))
                      # output as matrix.include list
                      | { include: . }
                      ')
          echo "jobmatrix=$J" >> $GITHUB_OUTPUT
          echo "has_jobs=$(echo "$J" | jq '.include | length > 0')" >> $GITHUB_OUTPUT
          echo "Preparing testjob files"

  submit-job:
    needs: prepare-job-list
    if: needs.prepare-job-list.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
    name: Submit ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-job-list.outputs.jobmatrix) }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update test definition ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # e.g. qrb2210-rb1/boot.yaml
          TEMPLATE="${LAVA_CI}${TARGET}"
          # left-side – e.g. qrb2210-rb1
          DEVICE_TYPE="${TARGET%/*}"
          BUILD_DOWNLOAD_URL="$BUILD_URL"
          BUILD_FILE_NAME="unused"
          sed \
              -e "s|{{BUILD_DOWNLOAD_URL}}|${BUILD_DOWNLOAD_URL}|g" \
              -e "s|{{BUILD_FILE_NAME}}|${BUILD_FILE_NAME}|g" \
              -e "s|{{DEVICE_TYPE}}|${DEVICE_TYPE}|g" \
              -e "s|{{SUITE}}|${SUITE}|g" \
              -e "s|{{GITHUB_REPOSITORY}}|${GITHUB_REPOSITORY}|g" \
              -e "s|{{GITHUB_RUN_ATTEMPT}}|${GITHUB_RUN_ATTEMPT}|g" \
              -e "s|{{GITHUB_RUN_ID}}|${GITHUB_RUN_ID}|g" \
              -e "s|{{GITHUB_SHA}}|${GITHUB_SHA}|g" \
              -i "$TEMPLATE"
          cat "$TEMPLATE"

      - name: Submit ${{ matrix.target }}
        timeout-minutes: 240
        uses: foundriesio/lava-action@3d40f621e0cd5acec50f557783b755f278ca892d # v13
        with:
          lava_token: ${{ secrets.LAVATOKEN }}
          lava_url: 'lava.infra.foundries.io'
          job_definition: ${{ env.LAVA_CI }}${{ matrix.target }}
          wait_for_job: true
          fail_action_on_failure: false
          save_result_as_artifact: true
          save_job_details: true
          # Stable per-suite/per-board name: the action deletes the previous
          # same-named artifact before uploading, so a re-run overwrites in
          # place and only the latest result per board ever exists.
          result_file_name: test-results-${{ inputs.suite }}-${{ matrix.slug }}
          # Job-details artifacts always keep the (changing) LAVA job id and are
          # never overwritten, so scope them by suite + run attempt instead.
          test_job_file_name_prefix: ${{ inputs.suite }}-${{ github.run_attempt }}-

  publish-test-results:
    name: Publish Tests Results
    needs: submit-job
    runs-on: ubuntu-latest
    permissions:
      checks: write # EnricoMi/publish-unit-test-result-action
      contents: read # EnricoMi/publish-unit-test-result-action
      packages: read # actions/download-artifact
      pull-requests: write # EnricoMi/publish-unit-test-result-action

    steps:
      # Artifacts live at the run level and persist across re-run attempts, so
      # scope the download to this suite's current results only. Without this,
      # download-artifact tries to fetch stale artifacts from superseded
      # attempts (and the other suite) and 404s on the orphaned ones.
      - name: Download test results (this debian suite; latest per board)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: test-results-${{ inputs.suite }}-*
      - name: Download job details (this debian suite, this run attempt)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: ${{ inputs.suite }}-${{ github.run_attempt }}-test-job-*

      - name: List files
        run: |
          echo $GITHUB_WORKSPACE
          ls -R $GITHUB_WORKSPACE

      - name: Publish Test Results
        # not pinned to a SHA: the enterprise allowed-actions policy matches
        # this third-party action by version tag, so a bare commit SHA is
        # rejected at workflow startup (startup_failure). See PR #503 / run
        # https://github.com/qualcomm-linux/qcom-deb-images/actions/runs/30561677856
        # nosemgrep: github-actions-mutable-action-tag
        uses: EnricoMi/publish-unit-test-result-action@v2 # zizmor: ignore[unpinned-uses]
        with:
          files: "${{ github.workspace }}/artifacts/**/*.xml"

      - name: Publish Test Job Details
        run: |
          for json_file in $(find ${{ github.workspace }} -name "*test-job-*.json")
          do
              DEVICE_TYPE=$(cat "$json_file" | jq -r ".requested_device_type")
              URL=$(cat "$json_file" | jq -r ".url")
              JOB_ID=$(cat "$json_file" | jq -r ".id")
              echo " * [Job $JOB_ID on $DEVICE_TYPE]($URL)"
              echo " * [Job $JOB_ID on $DEVICE_TYPE]($URL)" >> $GITHUB_STEP_SUMMARY
          done
