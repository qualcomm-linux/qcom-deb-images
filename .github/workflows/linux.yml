name: Build Linux kernel deb and debos image

on:
  workflow_call:
    inputs:
      kernel_name:
        description: 'Name of the kernel to build (default: mainline)'
        required: false
        type: string
        default: 'mainline'
      debos_extra_args:
        description: Extra arguments to pass to debos (e.g. -t dtb:qcom/some.dtb)
        required: false
        type: string
        default: ''
      build_linux_deb_extra_args:
        description: Extra arguments to pass to build-linux-deb.py
        required: false
        type: string
        default: ''
      skip_image_build:
        description: >
          Skip building image. The LAVA tests boot that image, so the test
          job is skipped along with it
        required: false
        type: boolean
        default: false
      skip_qemu_tests:
        description: Skip QEMU tests
        required: false
        type: boolean
        default: false
      skip_lava_tests:
        description: Skip LAVA tests
        required: false
        type: boolean
        default: false
      lava_boards_include:
        description: JSON array of board names to include in LAVA tests (empty = all boards)
        required: false
        type: string
        default: ''
      lava_boards_exclude:
        description: JSON array of board names to exclude from LAVA tests (empty = none excluded)
        required: false
        type: string
        default: ''
      lava_report_test_results_externally:
        description: >
          Report LAVA results as a check run on the commit and a comment on
          associated pull requests. Set false for kernels we track for
          reference but don't gate development on; their results then stay in
          the job summary
        required: false
        type: boolean
        default: true
    secrets:
      LAVATOKEN:
        description: API token used to submit jobs to LAVA
        # only forwarded to lava-test.yml; callers passing skip_lava_tests
        # never reach that job, so this stays optional
        required: false
  # allow manual runs
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Name of the kernel to build (default: mainline)'
        required: false
        type: string
      debos_extra_args:
        description: Extra arguments to pass to debos (e.g. -t dtb:qcom/some.dtb)
        required: false
        type: string
      build_linux_deb_extra_args:
        description: Extra arguments to pass to build-linux-deb.py
        required: false
        type: string

# grant nothing by default; every job below declares the scopes it needs. these
# are also capped by the calling job's permissions: block, so callers have to
# grant at least as much.
permissions: {}

env:
  # github runs are only unique per repository and may also be re-run; create a
  # build id for the current run
  BUILD_ID: ${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.run_attempt }}
  # name of the kernel being built
  KERNEL_NAME: ${{ inputs.kernel_name || 'mainline' }}
  # extra args to pass to build-linux-deb.py
  BUILD_LINUX_DEB_EXTRA_ARGS: ${{ inputs.build_linux_deb_extra_args }}

# cancel in progress builds for this workflow triggered by the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.kernel_name || 'mainline' }}
  cancel-in-progress: true

jobs:
  build-linux-deb:
    # don't run cron from forks of the main repository or from other branches
    if: github.repository == 'qualcomm-linux/qcom-deb-images' && github.ref == 'refs/heads/main'
    permissions:
      contents: read # actions/checkout
    # for cross-builds
    runs-on: [self-hosted, qcom-u2404, amd64]
    # alternative for native builds, but overkill to do both
    #runs-on: [self-hosted, qcom-u2404, arm64]
    container:
      image: public.ecr.aws/debian/debian:trixie
      volumes:
        - /efs/qli/qcom-deb-images:/efs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # make sure we have latest packages first, to get latest fixes, to avoid
      # an automated update while we're building, and to prevent version skews
      - name: Update OS packages
        run: |
          set -ux
          apt update
          apt -y upgrade
          apt -y full-upgrade

      - name: Build Linux kernel deb
        run: |
            set -ux
            # download arm64 package lists to install cross build-dependencies
            if [ "$(dpkg --print-architecture)" != arm64 ]; then
                dpkg --add-architecture arm64
                apt update
            fi
            # install build-dependencies; TODO: --no-install-recommends
            apt -y install git crossbuild-essential-arm64 make flex bison bc \
                libdw-dev libelf-dev libssl-dev libssl-dev:arm64 dpkg-dev \
                debhelper kmod python3 rsync coreutils
            scripts/build-linux-deb.py ${BUILD_LINUX_DEB_EXTRA_ARGS} \
                `ls kernel-configs/*.config | sort` \

      - name: Stage artifacts for upload
        run: |
          set -ux
          # dcmd from devscripts will be used to parse .changes file
          apt -y install --no-install-recommends devscripts
          # stage artifacts in a directory
          mkdir -v artifacts
          cp -av `dcmd *.changes` artifacts
          # also publish the unstripped vmlinux to help debug crashes: it
          # carries the kernel symbol table so oops/panic backtraces can be
          # symbolize. This matches the vmlinux artifact meta-qcom's Yocto CI
          # publishes and is required by teams analyzing kernel crashes.
          if [ -f linux/vmlinux ]; then
            cp -av linux/vmlinux artifacts/
          fi

      - name: Upload results to EFS
        run: |
          set -ux
          export BUILD_DIR="/efs/${BUILD_ID}"
          mkdir -vp "${BUILD_DIR}"
          cp -av artifacts/* "${BUILD_DIR}"
          # create or update symlink
          ln -fnsv "${BUILD_ID}" "/efs/${KERNEL_NAME}"
          # perhaps help NFS sync
          sync

      - name: Upload private artifacts
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        id: upload_artifacts
        with:
          path: artifacts
          # these should be the defaults; or ought to reuse BUILD_ID
          s3_bucket: qcom-prd-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/

  debos-linux-deb:
    if: ${{ !inputs.skip_image_build }}
    needs: build-linux-deb
    uses: ./.github/workflows/debos.yml
    permissions:
      contents: read
    with:
      kernelpackages: efs/${{ inputs.kernel_name || 'mainline' }}
      debos_extra_args: ${{ inputs.debos_extra_args }}
      skip_qemu_tests: ${{ inputs.skip_qemu_tests || false }}

  test-linux-deb:
    if: ${{ !inputs.skip_lava_tests }}
    uses: ./.github/workflows/lava-test.yml
    needs: debos-linux-deb
    permissions:
      checks: write
      contents: read
      packages: read
      pull-requests: write
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      url: ${{ needs.debos-linux-deb.outputs.artifacts_url }}
      suite: trixie
      boards_include: ${{ inputs.lava_boards_include }}
      boards_exclude: ${{ inputs.lava_boards_exclude }}
      report_test_results_externally: ${{ inputs.lava_report_test_results_externally }}
