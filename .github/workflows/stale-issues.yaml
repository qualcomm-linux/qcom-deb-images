name: Comment on Stale Issues
on:
    schedule:
      - cron: '30 1 * * *'

# grant nothing by default; every job below declares the scopes it needs
permissions: {}

jobs:
  stale:
    permissions:
      issues: write # actions/stale
      pull-requests: write # actions/stale
    # don't run cron from forks of the main repository or from other branches
    if: github.repository == 'qualcomm-linux/qcom-deb-images' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
            days-before-close: -1
            days-before-issue-stale: 30
            days-before-pr-stale: 30
            stale-pr-message: "This pull request has been marked as stale after 30 days of inactivity. Consider updating it or commenting on it if it's still active."
            stale-issue-message: "This issue has been marked as stale after 30 days of inactivity. Consider commenting on it or providing a pull request if one is not already being worked on."

