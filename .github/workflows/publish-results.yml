name: Publish test results

# Publishes the LAVA results of a whole run as one check. The test workflow
# runs once per kernel and suite and hands its results over as an artifact;
# this collects every one of them, so the check covers all the kernel
# configurations the run tested rather than one of them at a time.
on:
  workflow_call:
    inputs:
      commit:
        description: >
          Commit the check is reported against. Empty means the commit this run
          is for, which is right everywhere but on the pull request path, where
          this run is the base branch and the results belong to the pull
          request head.
        required: false
        type: string
        default: ''
      event_name:
        description: >
          Event the results are reported for. Only needed alongside commit, as
          github.event_name is workflow_run there rather than pull_request.
        required: false
        type: string
        default: ''
      build_id:
        description: >
          Run holding the event file, needed alongside commit. This is the
          triggering "Build on PR" run.
        required: false
        type: string
        default: ''
      report_test_results_externally:
        description: >
          true for builds whose failures say something about qcom-deb-images,
          false for builds whose failures say something about the code under
          test rather than about qcom-deb-images; results then stay in the job
          summary, which is written either way. A failed test fails the run in
          both cases.
        required: false
        type: boolean
        default: true
    secrets:
      TEST_REPORTING_APP_TOKEN:
        description: >
          Private key of the Test Reporting GitHub App. Its token publishes the
          check, so it comes from the app rather than from github-actions and
          gets a check suite of its own instead of landing in whichever
          workflow's suite happened to run.
        required: true

# grant nothing by default; every job below declares the scopes it needs. these
# are also capped by the calling job's permissions: block, so callers have to
# grant at least as much.
permissions: {}

jobs:
  publish:
    name: Publish test results
    runs-on: ubuntu-latest
    permissions:
      contents: read # EnricoMi/publish-unit-test-result-action
      checks: write # EnricoMi/publish-unit-test-result-action
      packages: read # actions/download-artifact
      pull-requests: write # EnricoMi/publish-unit-test-result-action
    steps:
      # every variant of this run, and only this run: artifacts live at the run
      # level and persist across re-run attempts
      - name: Download the results of every variant
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: results-*

      # the markdown summary of each variant, as in the pull request comment;
      # it becomes the body of the check run
      - name: Download the summary of every variant
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: summaries
          pattern: '*-test_job_summary'

      - name: Download event file
        if: ${{ inputs.commit != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.build_id }}
          name: Event File
          path: event-file
          github-token: ${{ github.token }}

      - name: Create Test Reporting App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: 2291458
          private-key: ${{ secrets.TEST_REPORTING_APP_TOKEN }}
          # Scope the token to what publish-unit-test-result-action uses on a
          # public repository instead of inheriting every permission of the app
          # installation. contents and issues are only needed on private repos,
          # and the app is not granted issues at all.
          permission-checks: write
          permission-pull-requests: write

      - name: Publish test results
        id: publish
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          files: "${{ github.workspace }}/artifacts/**/*.xml"
          commit: ${{ inputs.commit }}
          event_file: ${{ inputs.commit != '' && format('{0}/event-file/event.json', github.workspace) || '' }}
          event_name: ${{ inputs.event_name }}
          # GitHub only shows the latest check run of a given name from an
          # app on a commit; several workflows publish results for the same
          # commit on main, so each needs a name of its own or they hide each
          # other. github.workflow is the calling workflow's name
          check_name: Test Results (${{ github.workflow }})
          github_token: ${{ steps.app_token.outputs.token }}
          # one variant per kernel and suite runs the same tests, so tell the
          # runs apart instead of folding them into one result per test
          report_individual_runs: true
          report_suite_logs: any
          # the runs publishing this check test different boards, suites and
          # images, so a delta against an earlier commit compares unlike sets
          compare_to_earlier_commit: false
          # the check run is posted by the steps below instead, with the
          # summary of every variant rather than this action's generic
          # output; this action still parses the results, gates the job and
          # writes the job summary
          check_run: false
          # test-pr.yml already posts the results as a pull request comment,
          # so a comment from here would only duplicate it
          comment_mode: off
          # A failed test that is not a known failure has to fail this job
          action_fail: true
          # no results at all, or files that parse to nothing, is a failure of
          # this workflow rather than a pass
          action_fail_on_inconclusive: true

      # when not reporting externally, failures must not show up as a red
      # check on the commit (which may well be on main); the job summary keeps
      # the full table either way. always(), so failed results get their check
      # too: the step above fails the job when tests fail
      - name: Prepare check run
        id: check
        if: ${{ always() && inputs.report_test_results_externally }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ steps.publish.outputs.json || '{}' }}
        run: |
          set -euo pipefail
          # no results at all (the step above failed before writing them) is
          # a failure, as with action_fail_on_inconclusive
          conclusion=$(jq -r '.conclusion // "failure"' <<< "${RESULTS}")
          stats=$(jq -r '.title // "No test results"' <<< "${RESULTS}")
          case "${conclusion}" in
              success) title="✅ Tests passed" ;;
              neutral) title="Tests inconclusive" ;;
              *) conclusion=failure; title="❌ Tests failed" ;;
          esac
          mkdir -p summaries
          # a check run's text is limited to 65535 characters
          find summaries -type f -exec cat {} + |
              jq -Rrs '.[0:65535]' > summary.md
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
          # built with jq so quotes and newlines are escaped
          output=$(jq -c -n \
              --arg title "${title}" \
              --arg summary "${stats}"$'\n\n'"[Workflow run](${RUN_URL})" \
              '{title: $title, summary: $summary}')
          echo "output=${output}" >> "$GITHUB_OUTPUT"

      - name: Publish check run
        if: ${{ always() && inputs.report_test_results_externally }}
        uses: LouisBrunner/checks-action@937cbbcde3259005b50746dc91cde29098aac2ff # v3.1.0
        with:
          token: ${{ steps.app_token.outputs.token }}
          name: Test Results (${{ github.workflow }})
          sha: ${{ inputs.commit || github.sha }}
          status: completed
          conclusion: ${{ steps.check.outputs.conclusion }}
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          output: ${{ steps.check.outputs.output }}
          output_text_description_file: summary.md
