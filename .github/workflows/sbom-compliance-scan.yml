name: SBOM Compliance Scan

# Checks the VEX coverage of the SBOMs generated by debos.yml and scans them for
# vulnerabilities with Grype, once for all the images built by the calling
# workflow run.
#
# The SBOMs come from the "<prefix>-sbom.tar.gz" artifacts uploaded by
# debos.yml, where <prefix> is the ARTIFACT_PREFIX of the image; the reports
# are packed into a "<prefix>-vulns.tar.gz" archive per image, which is
# published next to the images and attached to the run as a "vulns" artifact.
#
# Callers can disable these checks by omitting this workflow.
#
# Manual runs scan the SBOMs of an earlier workflow run instead, e.g. to apply
# updated VEX statements or vulnerability data; the reports are then published
# under the manual run.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: >
          ID of the workflow run whose "<prefix>-sbom.tar.gz" artifacts to
          scan, from the URL of the run
        required: true
        type: string

# grant nothing by default; every job below declares the scopes it needs. these
# are also capped by the calling job's permissions: block, so callers have to
# grant at least as much.
permissions: {}

jobs:
  sbom-compliance-scan:
    name: Vulnerability scanning
    permissions:
      actions: read # actions/download-artifact, from another run
      contents: read # actions/checkout
    # unlike the image builds, this needs no privileges; a self-hosted runner
    # is still needed for EFS and for the credentials of the S3 bucket
    runs-on: [self-hosted, qcom-u2404, amd64]
    container:
      image: public.ecr.aws/debian/debian:trixie
      volumes:
        - /efsx/qli/qcom-deb-images:/efs
    steps:
      # ca-certificates is needed by Grype to download its database
      # curl is needed by download-grype to install Grype
      # pigz is needed to compress the reports for publishing
      # python3 is needed by the VEX and summary scripts
      # zstd is needed by scripts/grype-db-cache.sh
      - name: Install dependencies
        run: |
          set -ux
          apt update
          apt -y install --no-install-recommends \
              ca-certificates \
              curl \
              pigz \
              python3 \
              zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch OpenVEX data and coverage tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security-tracker
          path: .security-tracker
          sparse-checkout: |
            /vex/
            /scripts/vex-check.py
            /scripts/vexlib.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # the archives aren't zipped, so they are downloaded as is; merge them
      # into the same directory
      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-sbom.tar.gz'
          path: sbom-archives
          merge-multiple: true
          # in a manual run, from the requested run, which needs a token; the
          # run_id input is empty when called from another workflow
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ inputs.run_id && github.token || '' }}

      # Use the "download-grype" sub-action to install Grype and keep it
      # updated via Dependabot.
      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      # the vulnerability database is downloaded separately from the scan so
      # that a transient download failure is reported as its own step, and so
      # the database metadata (built date, schema) shows up in the logs; it also
      # lists the data providers, which is where the Debian Security Tracker
      # data comes from (provider "debian")
      #
      # installing the database takes minutes and it's only rebuilt upstream
      # about once a day, so it's shared through a cache on EFS; see
      # scripts/grype-db-cache.sh
      #
      # only runs from the main repository's main branch (or manual runs)
      # publish to the cache; other runs, e.g. for PRs, only read from it
      - name: Install Grype vulnerability database
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          UPDATE_CACHE: >-
            ${{ github.repository == 'qualcomm-linux/qcom-deb-images' &&
            (github.event_name == 'workflow_dispatch' ||
            github.ref == 'refs/heads/main') }}
        run: |
          set -ux
          "$GRYPE" --version
          # where Grype installs and looks up its database, for this and the
          # following steps; github.workspace is the path outside of the
          # container, so use the working directory instead
          export GRYPE_DB_CACHE_DIR="${PWD}/.grype-db"
          echo "GRYPE_DB_CACHE_DIR=${GRYPE_DB_CACHE_DIR}" >>"$GITHUB_ENV"
          set --
          if [ "$UPDATE_CACHE" != true ]; then
              set -- --read-only
          fi
          scripts/grype-db-cache.sh "$@" "$GRYPE" /efs/.cache/grype-db
          "$GRYPE" db status
          "$GRYPE" db providers

      # unpack each archive into sboms/<prefix>/, where the reports of the
      # image are written too
      - name: Unpack SBOMs
        run: |
          set -ux
          prefixes=""
          for archive in sbom-archives/*-sbom.tar.gz; do
              [ -f "${archive}" ] || continue
              prefix="$(basename "${archive}" -sbom.tar.gz)"
              mkdir -vp "sboms/${prefix}"
              tar -xv --use-compress-program=pigz -f "${archive}" \
                  -C "sboms/${prefix}"
              prefixes="${prefixes:+${prefixes} }${prefix}"
          done
          if [ -z "${prefixes}" ]; then
              echo "ERROR: no SBOMs were found; did any image build succeed?" >&2
              exit 1
          fi
          echo "PREFIXES=${prefixes}" >>"$GITHUB_ENV"

      # Static validation happens on security-tracker PRs. Only compare the
      # pre-validated assessments with the packages of each image here.
      - name: Check VEX coverage of the image SBOMs
        shell: bash
        run: |
          set -euxo pipefail
          shopt -s nullglob globstar
          for prefix in ${PREFIXES}; do
              python3 .security-tracker/scripts/vex-check.py --coverage-only \
                  --sbom "sboms/${prefix}/rootfs-sbom.syft.json" \
                  .security-tracker/vex/**/*.openvex.json |
                      tee "sboms/${prefix}/rootfs-vex-warnings.txt"
          done

      # scan the SBOMs generated by Syft rather than the rootfs directories:
      # it's much faster and it guarantees both reports describe exactly the
      # same set of packages
      #
      # the distro is not overridden with --distro: the SBOM already records the
      # Debian release from the rootfs' os-release, and that is what Grype needs
      # to select the Debian provider's data. passing a codename Grype doesn't
      # map to a release (e.g. forky while it's still testing) would silently
      # match nothing at all
      #
      # --by-cve reports CVE identifiers instead of Debian-specific DSA/DLA ids,
      # which is what downstream tooling and reports expect
      #
      # no --fail-on: a Debian image always carries known unfixed CVEs, so
      # failing the build on severity would make every build red; the reports
      # are published as artifacts for review instead
      #
      # no --ignore-states or --only-fixed either: Debian wont-fix findings
      # stay open until a validated security-tracker statement says otherwise
      #
      # the second scan only collects the affected and under_investigation
      # statements Grype applies, for the summary; see .github/grype-triage.yaml
      #
      # Grype takes each VEX document as its own --vex and matches their
      # versionless product against the versioned one of the SBOM's source
      - name: Scan SBOMs for vulnerabilities with Grype
        shell: bash
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          # the database is installed by the step above, so don't let Grype
          # check for updates and possibly download it again
          GRYPE_DB_AUTO_UPDATE: 'false'
        run: |
          set -euxo pipefail
          shopt -s nullglob globstar
          vex=()
          for f in .security-tracker/vex/**/*.openvex.json; do
              vex+=(--vex "$f")
          done
          for prefix in ${PREFIXES}; do
              dir="sboms/${prefix}"
              "$GRYPE" \
                  --config .github/grype.yaml \
                  --output json="${dir}/rootfs-vulns.grype.json" \
                  --output table="${dir}/rootfs-vulns.grype.txt" \
                  --output cyclonedx-json="${dir}/rootfs-vulns.grype.cyclonedx.json" \
                  --by-cve \
                  "${vex[@]}" \
                  --sort-by severity \
                  --verbose \
                  "sbom:${dir}/rootfs-sbom.syft.json"
              # all the outputs go to files, so echo the table to the log too
              cat "${dir}/rootfs-vulns.grype.txt"
              "$GRYPE" \
                  --config .github/grype-triage.yaml \
                  --output json="${dir}/rootfs-vulns-triage.grype.json" \
                  --by-cve \
                  "${vex[@]}" \
                  "sbom:${dir}/rootfs-sbom.syft.json"
          done

      # one archive per image, named like the images it describes, e.g.
      # trixie-vulns.tar.gz next to trixie-rootfs.tar.gz and
      # trixie-sbom.tar.gz, holding the Grype reports and the VEX coverage
      # warnings; the triage report only serves the summary
      - name: Pack vulnerability reports for publishing
        run: |
          set -ux
          mkdir -v reports
          for prefix in ${PREFIXES}; do
              tar -cv --use-compress-program=pigz \
                  -f "reports/${prefix}-vulns.tar.gz" \
                  -C "sboms/${prefix}" \
                  rootfs-vex-warnings.txt \
                  rootfs-vulns.grype.cyclonedx.json \
                  rootfs-vulns.grype.json \
                  rootfs-vulns.grype.txt
          done

      - name: Upload vulnerability reports as private artifacts
        uses: qualcomm-linux/upload-private-artifact-action@4940e9327cd7386acdb908b61c714c079b7d754b # aws-v4
        with:
          path: reports
          # these should be the defaults; or ought to reuse BUILD_ID
          s3_bucket: qcom-prd-gh-artifacts
          destination: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/

      # the archives are already compressed; overwrite the artifact of an
      # earlier attempt when the job is re-run
      - name: Upload vulnerability reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulns
          path: reports
          compression-level: 0
          overwrite: true

      # one section per image, in the order of the prefixes
      - name: Summarize vulnerabilities
        run: |
          set -ux
          for prefix in ${PREFIXES}; do
              dir="sboms/${prefix}"
              {
                  echo "# ${prefix}"
                  echo
              } >>"$GITHUB_STEP_SUMMARY"
              scripts/grype-vulnerability-summary.py \
                  "${dir}/rootfs-vulns.grype.json" \
                  --sbom "${dir}/rootfs-sbom.syft.json" \
                  --triage "${dir}/rootfs-vulns-triage.grype.json" \
                  >>"$GITHUB_STEP_SUMMARY"
              if [ -s "${dir}/rootfs-vex-warnings.txt" ]; then
                  {
                      echo "<details>"
                      echo "<summary>$(wc -l <"${dir}/rootfs-vex-warnings.txt") VEX warnings</summary>"
                      echo
                      echo '```'
                      cat "${dir}/rootfs-vex-warnings.txt"
                      echo '```'
                      echo
                      echo "</details>"
                      echo
                  } >>"$GITHUB_STEP_SUMMARY"
              fi
          done
