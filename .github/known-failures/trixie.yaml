# Tests that are known to fail on trixie images. See README.md for the format.
#
# Add the issue each failure is tracked in as its comment, and remove the entry
# once the issue is fixed: a listed test that passes is reported as an
# unexpected pass and fails the run.
#
# The failures below were all observed in run 35371401209 and are collected in
# https://github.com/qualcomm-linux/qcom-deb-images/issues/645.

qcs615-ride:
  - test: EFI_Variable_Validation
    comment: "fails with the stock Debian kernel, https://github.com/qualcomm-linux/qcom-deb-images/issues/645"
    kernels: [debian]
  - test: WiFi_Firmware_Driver
    comment: "fails with the stock Debian kernel, https://github.com/qualcomm-linux/qcom-deb-images/issues/645"
    kernels: [debian]
  - test: fastrpc_test_adsp
    comment: "fails with the stock Debian kernel, https://github.com/qualcomm-linux/qcom-deb-images/issues/696"
    kernels: [debian]
  - test: fastrpc_test_cdsp
    comment: "fails with the stock Debian kernel, https://github.com/qualcomm-linux/qcom-deb-images/issues/696"
    kernels: [debian]

qcs6490-rb3gen2:
  # these two pass on every other kernel flavour on this board
  - test: EFI_Variable_Validation
    comment: "fails with the stock Debian kernel, https://github.com/qualcomm-linux/qcom-deb-images/issues/645"
    kernels: [debian]
  - test: WiFi_Firmware_Driver
    comment: "fails with the stock Debian kernel, https://github.com/qualcomm-linux/qcom-deb-images/issues/645"
    kernels: [debian]

qrb2210-arduino-imola:
  - test: EFI_Variable_Validation
    comment: "expected to work on this board, does not yet, https://github.com/qualcomm-linux/qcom-deb-images/issues/645"

qrb2210-rb1:
  - test: EFI_Variable_Validation
    comment: "expected to work on this board, does not yet, https://github.com/qualcomm-linux/qcom-deb-images/issues/645"

"*":
  # every kernel flavour but debian rejects the Debian-signed regulatory.db
  # that wireless-regdb selects, and WiFi_Firmware_Driver fails on the
  # cfg80211 error that logs; remove once the PR below is merged
  - test: WiFi_Firmware_Driver
    comment: "cfg80211 rejects the Debian-signed regulatory.db, fixed by https://github.com/qualcomm-linux/qcom-deb-images/pull/863"
    kernels: [arduino, linux-next, mainline, qcom-7.3, qcom-laptops, qcom-next]
